<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050B18">
<title>Judo Kids — Gestion des Envois</title>
<style>
:root{
  --navy-900:#040A15;
  --navy-700:#0B1B33;
  --accent:#7C5CFF;
  --accent-soft:#AF52DE;
  --accent-deep:#5D3FA6;
  --bg-1:#1e1547;--bg-2:#141030;--bg-3:#0a0612;
  --success:#32D74B;
  --warning:#FFD426;
  --danger:#FF453A;
  --ink:#F2F6FF;
  --ink-2:rgba(242,246,255,.66);
  --ink-3:rgba(242,246,255,.42);
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.085);
  --glass-hi:rgba(255,255,255,.14);
  --stroke:rgba(255,255,255,.10);
  --stroke-2:rgba(255,255,255,.18);
  --g-hi:rgba(255,255,255,.11);
  --g-mid:rgba(255,255,255,.045);
  --g-lo:rgba(255,255,255,.018);
  --g-edge:rgba(255,255,255,.15);
  --r-sm:14px;--r-md:20px;--r-lg:26px;
  --shadow-md:0 12px 34px rgba(0,0,0,.38);
  --blur:42px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:system-ui,sans-serif;background:var(--navy-900);color:var(--ink);overflow:hidden}
body{-webkit-font-smoothing:antialiased}

#authScreen{display:flex;align-items:center;justify-content:center;height:100%;width:100%;position:fixed;top:0;left:0;background:var(--navy-900);z-index:10000;flex-direction:column;gap:20px}
#authScreen.hidden{display:none}

#root{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px;height:100%;overflow:hidden}
#root.hidden{display:none}

aside{display:flex;flex-direction:column;gap:20px;overflow:auto}
.logo{display:flex;align-items:center;gap:12px;padding:16px;background:var(--glass);border-radius:var(--r-md)}
.logo .ico{width:40px;height:40px;border-radius:var(--r-sm);background:linear-gradient(145deg,var(--accent),var(--accent-deep));display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.logo h1{font-size:16px;font-weight:700}

.nav-sec{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink-3);padding:12px 0 4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);border:1px solid transparent;cursor:pointer;width:100%;text-align:left}
.nav-btn:hover{background:var(--glass-2)}
.nav-btn.on{background:var(--glass-hi);border-color:var(--stroke-2);color:var(--ink)}
.nav-cnt{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-weight:700}

main{display:flex;flex-direction:column;gap:18px;overflow:auto}
.head h1{font-size:26px;font-weight:700}
.head p{font-size:13px;color:var(--ink-3)}

.glass{background:linear-gradient(158deg,var(--g-hi) 0%,var(--g-lo) 42%,var(--g-mid) 100%);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--g-edge);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:20px}

.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .lab{font-size:12px;color:var(--ink-3)}
.kpi .val{font-size:32px;font-weight:700}
.kpi .sub{font-size:11px;color:var(--ink-3)}

.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.tbl th{text-align:left;font-size:11px;font-weight:620;color:var(--ink-2);padding:10px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--stroke)}
.tbl td{padding:11px 10px;border-top:1px solid var(--stroke)}
.tbl tbody tr:hover{background:var(--glass-2)}
.tbl .nm{font-weight:580}

.btn{padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--stroke);background:var(--glass-2);color:var(--ink);cursor:pointer;font-weight:580}
.btn:hover{background:var(--glass-hi)}
.btn.pri{background:linear-gradient(145deg,var(--accent),var(--accent-soft));border:none;color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}

.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(50,215,75,.15);color:var(--success);border:1px solid rgba(50,215,75,.25)}
.pill.o{background:rgba(255,212,38,.15);color:var(--warning);border-color:rgba(255,212,38,.25)}

.action-btn{padding:6px 10px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink-2);cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.action-btn:hover{background:var(--glass-hi);color:var(--ink)}
.action-btn.danger{color:var(--danger)}
.action-btn.danger:hover{background:rgba(255,69,58,.15)}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--navy-700);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:28px;width:90%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:80vh;overflow-y:auto}
.modal-box h2{margin-bottom:16px;font-size:16px;font-weight:700}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.form-group input, .form-group select{width:100%;padding:10px 12px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink);font-size:14px;font-family:inherit}
.form-group input:focus, .form-group select:focus{outline:none;border-color:var(--accent)}

.form-actions{display:flex;gap:12px}
.form-actions button{flex:1}

.auth-box{width:100%;max-width:420px;padding:40px;background:var(--navy-700);border:1px solid var(--stroke-2);border-radius:var(--r-lg);box-shadow:var(--shadow-md)}
.auth-mark{width:50px;height:50px;margin:0 auto 20px;border-radius:var(--r-md);background:linear-gradient(145deg,var(--accent),var(--accent-deep));display:grid;place-items:center;color:#fff;font-weight:700;font-size:24px}
.auth-box h2{text-align:center;margin-bottom:24px;font-size:18px;font-weight:700}
.auth-box .form-group{margin-bottom:14px}
.auth-box button{width:100%;margin-top:8px}

#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:12px;z-index:9998}
.toast{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--glass-hi);border:1px solid var(--stroke-2);border-radius:var(--r-md);animation:slideIn .2s ease-out}
.toast.err{border-color:var(--danger)}
.toast.ok{border-color:var(--success)}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>

<div id="root" class="hidden">

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL = 'https://klbftabestrvyvmqcjca.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsYmZ0YWJlc3Rydnl2bXFjamNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTcwOTIsImV4cCI6MjEwNTY3MzA5Mn0.2pcg1B7Nh20HXM6A7uaH3nz6jWCNk9CReP7A_tgVum0';

// Fallback localStorage for Safari file://
const memstore = {};
const stg = {
  getItem: k => { try { return localStorage.getItem(k); } catch (e) { return memstore[k] || null; } },
  setItem: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { memstore[k] = v; } },
  removeItem: k => { try { localStorage.removeItem(k); } catch (e) { delete memstore[k]; } }
};

// CALENDRIER COMPLET (18 ENVOIS) - 2026 à 2029
const SCHEDULE = [
  {shipment:1, mag:4, release:'2026-09-01', deadline:'2026-10-15'},
  {shipment:2, mag:5, release:'2026-11-01', deadline:'2026-12-15'},
  {shipment:3, mag:6, release:'2027-01-01', deadline:'2027-02-15'},
  {shipment:4, mag:7, release:'2027-03-01', deadline:'2027-04-15'},
  {shipment:5, mag:8, release:'2027-05-01', deadline:'2027-06-15'},
  {shipment:6, mag:9, release:'2027-07-01', deadline:'2027-08-15'},
  {shipment:7, mag:10, release:'2027-09-01', deadline:'2027-10-15'},
  {shipment:8, mag:11, release:'2027-11-01', deadline:'2027-12-15'},
  {shipment:9, mag:12, release:'2028-01-01', deadline:'2028-02-15'},
  {shipment:10, mag:13, release:'2028-03-01', deadline:'2028-04-15'},
  {shipment:11, mag:14, release:'2028-05-01', deadline:'2028-06-15'},
  {shipment:12, mag:15, release:'2028-07-01', deadline:'2028-08-15'},
  {shipment:13, mag:16, release:'2028-09-01', deadline:'2028-10-15'},
  {shipment:14, mag:17, release:'2028-11-01', deadline:'2028-12-15'},
  {shipment:15, mag:18, release:'2029-01-01', deadline:'2029-02-15'},
  {shipment:16, mag:19, release:'2029-03-01', deadline:'2029-04-15'},
  {shipment:17, mag:20, release:'2029-05-01', deadline:'2029-06-15'},
  {shipment:18, mag:21, release:'2029-07-01', deadline:'2029-08-15'},
];

// Déterminer le magazine selon la date d'abonnement
function getMagazineForSubscription(subDate) {
  const subDateObj = new Date(subDate);
  for (let i = 0; i < SCHEDULE.length; i++) {
    const deadlineDate = new Date(SCHEDULE[i].deadline);
    if (subDateObj <= deadlineDate) return SCHEDULE[i].mag;
  }
  return SCHEDULE[SCHEDULE.length - 1].mag + 1;
}

let sb = null;

// STATE GLOBAL (Scan Avis pattern)
const S = {
  user: null,
  db: null,
  view: 'dash',
  editingId: null,
  renewingId: null,
  selectedMonth: 'all'
};

// UTILITAIRES
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
const uid = () => crypto.randomUUID?.() || 'xxxx-xxxx-xxxx-xxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16));

function toast(msg, type='ok') {
  const ico = {ok:'✓', er:'⚠', in:'ℹ'}[type]||'ℹ';
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${ico}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function openModal(id) { $(`#${id}`).classList.add('open'); }
function closeModal(id) { $(`#${id}`).classList.remove('open'); }

// INIT SUPABASE
function initClient() {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      storage: stg,
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: false
    }
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' && S.user) {
      S.user = null;
      S.db = null;
      $('#root').classList.add('hidden');
      $('#authScreen').classList.remove('hidden');
      $('#loginPassword').value = '';
      $('#loginEmail').value = '';
    }
  });
}

// AUTHENTIFICATION
async function handleLogin(e) {
  e.preventDefault();
  const email = $('#loginEmail').value.trim().toLowerCase();
  const pass = $('#loginPassword').value;

  if (!email || !pass) return showLoginError('Remplissez tous les champs');

  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Connexion…';

  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;

    const ok = await openSession();
    if (ok) toast('Connecté! 🎯');
  } catch (err) {
    showLoginError(err.message.includes('Invalid') ? 'Email ou mot de passe incorrect' : err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}

function showLoginError(msg) {
  const el = $('#loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

async function openSession() {
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return false;

    let { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();

    if (prof && prof.actif === false) {
      await sb.auth.signOut();
      showLoginError('Compte désactivé');
      return false;
    }

    S.user = { id: user.id, email: user.email, name: prof?.nom || user.email };
    S.db = await API.loadAll();

    $('#authScreen').classList.add('hidden');
    $('#root').classList.remove('hidden');
    
    renderDash();
    updateCounts();

    return true;
  } catch (err) {
    console.error('openSession:', err);
    showLoginError('Erreur chargement données');
    return false;
  }
}

async function handleLogout() {
  if (!confirm('Déconnexion ?')) return;
  await sb.auth.signOut();
  S.user = null;
  S.db = null;
  $('#root').classList.add('hidden');
  $('#authScreen').classList.remove('hidden');
  $('#loginPassword').value = '';
  $('#loginEmail').value = '';
}

// API OBJECT (SCAN AVIS PATTERN)
const API = {
  async loadAll() {
    const uid = S.user.id;
    const [{ data: subs }, { data: ships }] = await Promise.all([
      sb.from('subscribers').select('*').eq('user_id', uid).order('created_at'),
      sb.from('shipments').select('*').eq('user_id', uid).order('scheduled_date')
    ]);
    return { subscribers: subs || [], shipments: ships || [] };
  },

  async saveSubscriber(data) {
    const recId = uid();
    const { error } = await sb.from('subscribers').insert({
      id: recId,
      user_id: S.user.id,
      first_name: data.fname,
      last_name: data.lname,
      email: data.email || null,
      phone: data.phone || null,
      address: data.addr || null,
      subscription_date: data.date,
      subscription_duration: data.duration
    });

    if (error) throw error;

    // Créer les envois automatiquement selon le calendrier complet (jusqu'à 18)
    const subDate = new Date(data.date);
    const endDate = new Date(subDate);
    endDate.setFullYear(endDate.getFullYear() + data.duration);

    // Déterminer le premier magazine selon la date d'abo
    const startMag = getMagazineForSubscription(data.date);

    const ships = [];
    let shipNum = 1;
    for (let sched of SCHEDULE) {
      if (sched.mag < startMag) continue;
      const sendDate = new Date(sched.release);
      if (sendDate > endDate) break;

      ships.push({
        id: uid(),
        user_id: S.user.id,
        subscriber_id: recId,
        shipment_number: shipNum,
        magazine_number: sched.mag,
        poster_number: shipNum,
        sticker_pair_start: shipNum,
        sticker_pair_end: shipNum,
        scheduled_date: sched.release,
        sent_at: null
      });
      shipNum++;
    }

    if (ships.length > 0) {
      const { error: e2 } = await sb.from('shipments').insert(ships);
      if (e2) throw e2;
    }

    S.db = await this.loadAll();
  },

  async updateSubscriber(id, data) {
    const { error } = await sb.from('subscribers').update({
      first_name: data.fname,
      last_name: data.lname,
      email: data.email || null,
      phone: data.phone || null,
      address: data.addr || null
    }).eq('id', id);

    if (error) throw error;
    S.db = await this.loadAll();
  },

  async deleteSubscriber(id) {
    const { error } = await sb.from('subscribers').delete().eq('id', id);
    if (error) throw error;
    S.db = await this.loadAll();
  },

  async markSent(shipId) {
    const { error } = await sb.from('shipments').update({
      sent_at: new Date().toISOString()
    }).eq('id', shipId);
    if (error) throw error;
    S.db = await this.loadAll();
  },

  async unmarkSent(shipId) {
    const { error } = await sb.from('shipments').update({
      sent_at: null
    }).eq('id', shipId);
    if (error) throw error;
    S.db = await this.loadAll();
  },

  async renewSubscription(id, data) {
    // Mettre à jour l'abonné avec nouvelle date et durée
    const { error: e1 } = await sb.from('subscribers').update({
      subscription_date: data.date,
      subscription_duration: data.duration
    }).eq('id', id);
    
    if (e1) throw e1;

    // Supprimer les anciens envois non-envoyés
    const { error: e2 } = await sb.from('shipments').delete().eq('subscriber_id', id).is('sent_at', null);
    if (e2) throw e2;

    // Créer les nouveaux envois selon le calendrier
    const newDate = new Date(data.date);
    const endDate = new Date(newDate);
    endDate.setFullYear(endDate.getFullYear() + data.duration);
    
    const startMag = getMagazineForSubscription(data.date);
    
    const ships = [];
    let shipNum = 1;
    for (let sched of SCHEDULE) {
      if (sched.mag < startMag) continue;
      const sendDate = new Date(sched.release);
      if (sendDate > endDate) break;

      ships.push({
        id: uid(),
        user_id: S.user.id,
        subscriber_id: id,
        shipment_number: shipNum,
        magazine_number: sched.mag,
        poster_number: shipNum,
        sticker_pair_start: shipNum,
        sticker_pair_end: shipNum,
        scheduled_date: sched.release,
        sent_at: null
      });
      shipNum++;
    }

    if (ships.length > 0) {
      const { error: e3 } = await sb.from('shipments').insert(ships);
      if (e3) throw e3;
    }

    S.db = await this.loadAll();
  }
};

// RENDERERS
function renderDash() {
  const subs = S.db.subscribers || [];
  const ships = S.db.shipments || [];
  const sent = ships.filter(s => s.sent_at).length;
  
  // Déterminer le magazine actuel
  const today = new Date();
  let currentMag = null;
  for (let sched of SCHEDULE) {
    if (new Date(sched.release) <= today) currentMag = sched.mag;
    else break;
  }
  
  const currentPending = ships.filter(s => s.magazine_number === currentMag && !s.sent_at).length;
  const currentSent = ships.filter(s => s.magazine_number === currentMag && s.sent_at).length;
  const currentProg = currentSent + currentPending > 0 ? Math.round((currentSent / (currentSent + currentPending)) * 100) : 0;

  $('#content').innerHTML = `
    <div class="head">
      <h1>📊 Dashboard</h1>
      <p>Vue d'ensemble de vos envois</p>
    </div>
    <div class="glass">
      <div class="grid g-4">
        <div class="kpi">
          <div class="lab">👥 Abonnés</div>
          <div class="val">${subs.length}</div>
          <div class="sub">Actuellement actifs</div>
        </div>
        <div class="kpi">
          <div class="lab">📦 En attente</div>
          <div class="val">${currentPending}</div>
          <div class="sub">Mag #${currentMag} à envoyer</div>
        </div>
        <div class="kpi">
          <div class="lab">✅ Envoyés</div>
          <div class="val" style="color:var(--success)">${currentSent}</div>
          <div class="sub">Mag #${currentMag}</div>
        </div>
        <div class="kpi">
          <div class="lab">🎯 Total</div>
          <div class="val">${ships.filter(s => !s.sent_at).length}</div>
          <div class="sub">Tous les magazines</div>
        </div>
      </div>
    </div>
    
    <div class="glass">
      <div style="font-weight:700;margin-bottom:12px">📚 Magazine #${currentMag}</div>
      <div style="height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden">
        <div style="width:${currentProg}%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));transition:width .4s"></div>
      </div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:8px"><b>${currentSent}/${currentSent+currentPending}</b> abonnés livrés</div>
    </div>
  `;
}

function renderSubscribers() {
  const subs = S.db.subscribers || [];

  let html = `
    <div class="head">
      <h1>👥 Abonnés</h1>
      <p>${subs.length} abonné(s)</p>
    </div>
    <button class="btn pri" onclick="openModal('addModal')" style="width:fit-content">➕ Ajouter</button>
    <div class="glass">
      <table class="tbl">
        <thead><tr>
          <th>Nom</th><th>Email</th><th>Téléphone</th><th>Date abo</th><th>Durée</th><th>Actions</th>
        </tr></thead>
        <tbody>
  `;

  subs.forEach(s => {
    html += `<tr>
      <td class="nm"><a href="#" onclick="viewProfile('${s.id}');return false" style="color:var(--accent);cursor:pointer;text-decoration:none">${esc(s.first_name)} ${esc(s.last_name)}</a></td>
      <td style="font-size:12px;color:var(--ink-3)">${esc(s.email||'—')}</td>
      <td style="font-size:12px;color:var(--ink-3)">${esc(s.phone||'—')}</td>
      <td style="font-size:12px">${s.subscription_date}</td>
      <td>${s.subscription_duration} an(s)</td>
      <td>
        <button class="action-btn" onclick="editSub('${s.id}')">✏️</button>
        <button class="action-btn danger" onclick="deleteSub('${s.id}')">✕</button>
      </td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  $('#content').innerHTML = html;
}

function renderShipments() {
  const ships = S.db.shipments || [];
  const subs = S.db.subscribers || [];
  
  // Grouper par mois
  const byMonth = {};
  ships.forEach(s => {
    const date = new Date(s.scheduled_date);
    const key = date.toLocaleDateString('fr-FR', {year:'numeric', month:'long'});
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(s);
  });
  
  const months = Object.keys(byMonth).sort();
  const pending = ships.filter(s => !s.sent_at).length;
  
  let html = `
    <div class="head">
      <h1>📦 Envois</h1>
      <p>${pending} en attente · ${ships.filter(s => s.sent_at).length} envoyés</p>
    </div>
    
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <select onchange="S.selectedMonth=this.value;renderShipments()" style="padding:10px 12px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink);font-size:14px;flex:1;max-width:200px">
        <option value="all">📅 Tous les mois</option>
        ${months.map(m => `<option value="${m}">${m}</option>`).join('')}
      </select>
    </div>
  `;
  
  let shipsToShow = ships;
  if (S.selectedMonth && S.selectedMonth !== 'all') {
    shipsToShow = byMonth[S.selectedMonth] || [];
  }
  
  html += `<div class="glass"><table class="tbl">
    <thead><tr><th>Abonné</th><th>Magazine</th><th>Date</th><th>Poster</th><th>Stickers</th><th>Statut</th></tr></thead>
    <tbody>`;
  
  shipsToShow.forEach(s => {
    const sub = subs.find(x => x.id === s.subscriber_id);
    const status = s.sent_at
      ? `<span class="pill"><span onclick="unmarkSent('${s.id}')" style="cursor:pointer">✓ ${s.sent_at.slice(0,10)}</span></span>`
      : `<button class="action-btn" onclick="markSent('${s.id}')">Marquer envoyé</button>`;

    html += `<tr>
      <td class="nm"><a href="#" onclick="viewProfile('${s.subscriber_id}');return false" style="color:var(--accent);cursor:pointer;text-decoration:none">${esc(sub?.first_name||'?')} ${esc(sub?.last_name||'?')}</a></td>
      <td>#${s.magazine_number}</td>
      <td>${new Date(s.scheduled_date).toLocaleDateString('fr-FR')}</td>
      <td>#${s.poster_number}</td>
      <td>#${s.sticker_pair_start}–${s.sticker_pair_end}</td>
      <td>${status}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  $('#content').innerHTML = html;
}

function renderSettings() {
  $('#content').innerHTML = `
    <div class="head"><h1>⚙️ Paramètres</h1></div>
    <div class="glass">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700">👤 Compte</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:4px">${esc(S.user.email)}</div>
          <div style="font-size:12px;color:var(--ink-3)">${esc(S.user.name)}</div>
        </div>
        <button class="btn" onclick="handleLogout()">🚪 Déconnexion</button>
      </div>
    </div>
  `;
}

// UI
function switchView(v) {
  S.view = v;
  $$('.nav-btn').forEach(b => b.classList.remove('on'));
  event.target.closest('.nav-btn').classList.add('on');
  if (v === 'dash') renderDash();
  else if (v === 'subscribers') renderSubscribers();
  else if (v === 'shipments') renderShipments();
  else if (v === 'settings') renderSettings();
}

function updateCounts() {
  const subs = S.db.subscribers || [];
  const ships = S.db.shipments || [];
  const pending = ships.filter(s => !s.sent_at).length;
  $('#cntSub').textContent = subs.length;
  $('#cntShip').textContent = pending;
}

// ACTIONS
async function handleAddSubscriber(e) {
  e.preventDefault();
  const data = {
    fname: $('#add_fname').value.trim(),
    lname: $('#add_lname').value.trim(),
    email: $('#add_email').value.trim(),
    phone: $('#add_phone').value.trim(),
    addr: $('#add_addr').value.trim(),
    date: $('#add_date').value,
    duration: parseInt($('#add_duration').value)
  };

  if (!data.fname || !data.lname) return toast('Remplissez nom et prénom', 'er');

  try {
    await API.saveSubscriber(data);
    closeModal('addModal');
    ['fname','lname','email','phone','addr','date','duration'].forEach(k => $(`#add_${k}`).value = '');
    updateCounts();
    renderSubscribers();
    toast('Abonné créé! 🎉', 'ok');
  } catch (err) {
    toast(err.message, 'er');
  }
}

async function deleteSub(id) {
  if (!confirm('Supprimer?')) return;
  try {
    await API.deleteSubscriber(id);
    updateCounts();
    renderSubscribers();
    toast('Abonné supprimé', 'ok');
  } catch (err) {
    toast(err.message, 'er');
  }
}

async function markSent(shipId) {
  try {
    await API.markSent(shipId);
    updateCounts();
    renderShipments();
    toast('Envoi marqué ✓', 'ok');
  } catch (err) {
    toast(err.message, 'er');
  }
}

async function unmarkSent(shipId) {
  try {
    await API.unmarkSent(shipId);
    updateCounts();
    renderShipments();
    if (S.renewingId) viewProfile(S.renewingId); // Refresh profile if open
    toast('Envoi démarqué', 'ok');
  } catch (err) {
    toast(err.message, 'er');
  }
}

function editSub(id) {
  const sub = S.db.subscribers.find(s => s.id === id);
  if (!sub) return;
  
  $('#edit_fname').value = sub.first_name;
  $('#edit_lname').value = sub.last_name;
  $('#edit_email').value = sub.email || '';
  $('#edit_phone').value = sub.phone || '';
  $('#edit_addr').value = sub.address || '';
  
  window.currentEditId = id;
  openModal('editModal');
}

async function handleEditSubscriber(e) {
  e.preventDefault();
  const data = {
    fname: $('#edit_fname').value.trim(),
    lname: $('#edit_lname').value.trim(),
    email: $('#edit_email').value.trim(),
    phone: $('#edit_phone').value.trim(),
    addr: $('#edit_addr').value.trim()
  };

  try {
    await API.updateSubscriber(window.currentEditId, data);
    closeModal('editModal');
    updateCounts();
    renderSubscribers();
    toast('Abonné modifié', 'ok');
  } catch (err) {
    toast(err.message, 'er');
  }
}

// FONCTION: Afficher le profil détaillé d'un abonné
function viewProfile(id) {
  const sub = S.db.subscribers.find(s => s.id === id);
  if (!sub) return;
  
  const subs = S.db.shipments.filter(s => s.subscriber_id === id).sort((a, b) => new Date(a.scheduled_date) - new Date(b.scheduled_date));
  const sent = subs.filter(s => s.sent_at).length;
  
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px">
      <button class="btn" onclick="closeModal('profileModal')">← Fermer</button>
      <div style="flex:1;margin:0 20px">
        <h2>${esc(sub.first_name + ' ' + sub.last_name)}</h2>
        <p style="color:var(--ink-3)">Abonné depuis le ${sub.subscription_date}</p>
      </div>
      <button class="btn pri" onclick="openRenewModal(${id})">🔄 Renouveler</button>
    </div>
    
    <div class="glass" style="margin-bottom:16px">
      <div style="font-weight:700;margin-bottom:12px">📋 Informations</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
        <div><div class="lab">Email</div>${esc(sub.email || '—')}</div>
        <div><div class="lab">Téléphone</div>${esc(sub.phone || '—')}</div>
        <div><div class="lab">Adresse</div>${esc(sub.address || '—')}</div>
        <div><div class="lab">Durée</div>${sub.subscription_duration || 0} an(s)</div>
      </div>
    </div>
    
    <div class="glass">
      <div style="font-weight:700;margin-bottom:12px">📚 Envois (${sent}/${subs.length})</div>
      <table class="tbl">
        <thead><tr><th>Mag</th><th>Date</th><th>Poster</th><th>Stickers</th><th>Statut</th></tr></thead>
        <tbody>${subs.map(s => `<tr>
          <td>#${s.magazine_number}</td>
          <td>${new Date(s.scheduled_date).toLocaleDateString('fr-FR')}</td>
          <td>#${s.poster_number}</td>
          <td>${s.sticker_pair_start}-${s.sticker_pair_end}</td>
          <td><span class="pill ${s.sent_at ? '' : 'o'}">${s.sent_at ? '✅ Envoyé' : '⏳ Attente'}</span></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  `;
  
  $('#profileContent').innerHTML = html;
  $('#profileModal').classList.add('open');
}

function openRenewModal(id) {
  S.renewingId = id;
  $('#renew_date').value = '';
  $('#renew_duration').value = '';
  $('#renewModal').classList.add('open');
}

function closeRenewModal() {
  $('#renewModal').classList.remove('open');
  S.renewingId = null;
}

async function handleRenewal(e) {
  e.preventDefault();
  const sub = S.db.subscribers.find(s => s.id === S.renewingId);
  if (!sub) return toast('Abonné non trouvé', 'er');
  
  const data = {
    date: $('#renew_date').value,
    duration: parseInt($('#renew_duration').value)
  };
  
  if (!data.date || !data.duration) return toast('Remplissez tous les champs', 'er');
  
  try {
    await API.renewSubscription(S.renewingId, data);
    closeModal('renewModal');
    updateCounts();
    viewProfile(S.renewingId); // Recharger le profil
    toast('Abonnement renouvelé! 🎉', 'ok');
  } catch (err) {
    toast(err.message, 'er');
  }
}

// STARTUP
(async () => {
  try {
    initClient();
    const { data: { session } } = await sb.auth.getSession();
    
    if (session) {
      const ok = await openSession();
      if (!ok) $('#authScreen').classList.remove('hidden');
    } else {
      $('#authScreen').classList.remove('hidden');
    }
  } catch (err) {
    console.error('Startup:', err);
    toast('Erreur démarrage', 'er');
  }
})();

</script>
