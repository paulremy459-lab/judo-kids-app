<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050B18">
<title>Judo Kids — Gestion des Envois</title>
<style>
:root{
  --navy-900:#040A15;
  --navy-700:#0B1B33;
  --accent:#7C5CFF;
  --accent-soft:#AF52DE;
  --accent-deep:#5D3FA6;
  --bg-1:#1e1547;--bg-2:#141030;--bg-3:#0a0612;
  --success:#32D74B;
  --warning:#FFD426;
  --danger:#FF453A;
  --ink:#F2F6FF;
  --ink-2:rgba(242,246,255,.66);
  --ink-3:rgba(242,246,255,.42);
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.085);
  --glass-hi:rgba(255,255,255,.14);
  --stroke:rgba(255,255,255,.10);
  --stroke-2:rgba(255,255,255,.18);
  --g-hi:rgba(255,255,255,.11);
  --g-mid:rgba(255,255,255,.045);
  --g-lo:rgba(255,255,255,.018);
  --g-edge:rgba(255,255,255,.15);
  --r-sm:14px;--r-md:20px;--r-lg:26px;
  --shadow-md:0 12px 34px rgba(0,0,0,.38);
  --blur:42px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:system-ui,sans-serif;background:var(--navy-900);color:var(--ink);overflow:hidden}
body{-webkit-font-smoothing:antialiased}

#loginScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--navy-900);display:flex;align-items:center;justify-content:center;z-index:99999}
#loginScreen.hidden{display:none}

#root{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px;height:100%;overflow:hidden;display:none}
#root.visible{display:grid}

aside{display:flex;flex-direction:column;gap:20px;overflow:auto}
.logo{display:flex;align-items:center;gap:12px;padding:16px;background:var(--glass);border-radius:var(--r-md)}
.logo .ico{width:40px;height:40px;border-radius:var(--r-sm);background:linear-gradient(145deg,var(--accent),var(--accent-deep));display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.logo h1{font-size:16px;font-weight:700}

.nav-sec{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink-3);padding:12px 0 4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);border:1px solid transparent;cursor:pointer;width:100%;text-align:left}
.nav-btn:hover{background:var(--glass-2)}
.nav-btn.on{background:var(--glass-hi);border-color:var(--stroke-2);color:var(--ink)}
.nav-cnt{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-weight:700}

main{display:flex;flex-direction:column;gap:18px;overflow:auto;padding-right:12px}
.head h1{font-size:26px;font-weight:700}
.head p{font-size:13px;color:var(--ink-3)}

.glass{background:linear-gradient(158deg,var(--g-hi) 0%,var(--g-lo) 42%,var(--g-mid) 100%);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--g-edge);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:20px}

.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .lab{font-size:12px;color:var(--ink-3)}
.kpi .val{font-size:32px;font-weight:700}
.kpi .sub{font-size:11px;color:var(--ink-3)}

.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.tbl th{text-align:left;font-size:11px;font-weight:620;color:var(--ink-2);padding:10px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--stroke)}
.tbl td{padding:11px 10px;border-top:1px solid var(--stroke)}
.tbl tbody tr:hover{background:var(--glass-2)}
.tbl .nm{font-weight:580}

.btn{padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--stroke);background:var(--glass-2);color:var(--ink);cursor:pointer;font-weight:580}
.btn:hover{background:var(--glass-hi)}
.btn.pri{background:linear-gradient(145deg,var(--accent),var(--accent-soft));border:none;color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}

.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(50,215,75,.15);color:var(--success);border:1px solid rgba(50,215,75,.25)}
.pill.o{background:rgba(255,212,38,.15);color:var(--warning);border-color:rgba(255,212,38,.25)}

.action-btn{padding:6px 10px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink-2);cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.action-btn:hover{background:var(--glass-hi);color:var(--ink)}
.action-btn.danger{color:var(--danger)}
.action-btn.danger:hover{background:rgba(255,69,58,.15)}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--navy-700);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:28px;width:90%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:80vh;overflow-y:auto;position:relative;z-index:10000}
.modal-box h2{font-size:18px;margin-bottom:16px}
.form-group{margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.form-group:last-of-type{margin-bottom:40px}
.form-group label{font-size:12px;font-weight:600;color:var(--ink-3)}
.form-group input,.form-group textarea{padding:10px 12px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink);font-size:14px}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);background:var(--glass-hi)}
.form-actions{display:flex;gap:12px;margin-top:24px}
.form-actions button{flex:1;padding:12px;border-radius:var(--r-sm);border:1px solid var(--stroke);background:var(--glass-2);color:var(--ink);cursor:pointer;font-weight:580}
.form-actions button.pri{background:linear-gradient(145deg,var(--accent),var(--accent-soft));border:none;color:#fff}
.form-actions button.danger{background:rgba(255,69,58,.2);border-color:rgba(255,69,58,.4);color:var(--danger)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>

<div id="loginScreen">
  <div style="background:linear-gradient(158deg,var(--g-hi) 0%,var(--g-lo) 42%,var(--g-mid) 100%);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--g-edge);border-radius:var(--r-lg);padding:40px;width:90%;max-width:400px;box-shadow:var(--shadow-md)">
    <h2 style="font-size:24px;font-weight:700;margin-bottom:10px">🥋 Judo Kids</h2>
    <p style="font-size:13px;color:var(--ink-3);margin-bottom:30px">Gestion des envois</p>
    <form onsubmit="doLogin(event)" style="display:flex;flex-direction:column;gap:14px">
      <input type="email" id="loginEmail" placeholder="Email" required style="padding:12px 14px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink);font-size:14px;outline:none" />
      <input type="password" id="loginPassword" placeholder="Mot de passe" required style="padding:12px 14px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink);font-size:14px;outline:none" />
      <button type="submit" style="padding:12px;background:linear-gradient(145deg,var(--accent),var(--accent-soft));border:none;border-radius:var(--r-sm);color:#fff;font-weight:600;cursor:pointer;margin-top:10px">Connexion</button>
    </form>
    <div id="loginError" style="color:var(--danger);font-size:12px;margin-top:14px;text-align:center;display:none"></div>
  </div>
</div>

<div id="root">
  <aside>
    <div class="logo">
      <div class="ico">🥋</div>
      <div><h1>Judo Kids</h1></div>
    </div>
    
    <div>
      <div class="nav-sec">Navigation</div>
      <button class="nav-btn on" onclick="goView('dashboard')">📊 Dashboard</button>
      <button class="nav-btn" onclick="goView('abonnes')">👥 Abonnés <span class="nav-cnt" id="cntAbo">0</span></button>
      <button class="nav-btn" onclick="goView('envois')">📦 Envois <span class="nav-cnt" id="cntEnv">0</span></button>
      <button class="nav-btn" onclick="goView('settings')">⚙️ Paramètres</button>
    </div>
  </aside>

  <main id="content"></main>
</div>

<div id="addModal" class="modal">
  <div class="modal-box">
    <h2>Ajouter un abonné</h2>
    <form onsubmit="saveSubscriber(event)">
      <div class="form-group">
        <label>Prénom*</label>
        <input type="text" id="fname" required>
      </div>
      <div class="form-group">
        <label>Nom*</label>
        <input type="text" id="lname" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email">
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" id="addr">
      </div>
      <div class="form-actions">
        <button type="button" onclick="closeModal('addModal')">Annuler</button>
        <button type="submit" class="pri">Créer</button>
      </div>
    </form>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-box">
    <h2>Modifier abonné</h2>
    <form onsubmit="updateSubscriber(event)">
      <div class="form-group">
        <label>Prénom*</label>
        <input type="text" id="edit_fname" required>
      </div>
      <div class="form-group">
        <label>Nom*</label>
        <input type="text" id="edit_lname" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="edit_email">
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" id="edit_addr">
      </div>
      <div class="form-actions">
        <button type="button" onclick="closeModal('editModal')">Annuler</button>
        <button type="button" class="danger" onclick="deleteSubscriber(editingSubId)">Supprimer</button>
        <button type="submit" class="pri">Sauvegarder</button>
      </div>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://klbftabestrvyvmqcjca.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsYmZ0YWJlc3Rydnl2bXFjamNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTcwOTIsImV4cCI6MjEwNTY3MzA5Mn0.2pcg1B7Nh20HXM6A7uaH3nz6jWCNk9CReP7A_tgVum0';

let sb = null;
let subscribers = [];
let shipments = [];
let editingSubId = null;

const $ = id => document.getElementById(id);

// Init
(async () => {
  if(window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const {data: {session}} = await sb.auth.getSession();
    if(session) {
      $('loginScreen').classList.add('hidden');
      $('root').classList.add('visible');
      await loadData();
      renderDash();
    }
  }
})();

async function doLogin(e) {
  e.preventDefault();
  const email = $('loginEmail').value;
  const pwd = $('loginPassword').value;
  try {
    const {error} = await sb.auth.signInWithPassword({email, password: pwd});
    if(error) throw error;
    $('loginScreen').classList.add('hidden');
    $('root').classList.add('visible');
    await loadData();
    renderDash();
  } catch(e) {
    $('loginError').textContent = '❌ ' + e.message;
    $('loginError').style.display = 'block';
  }
}

async function loadData() {
  try {
    const {data: subs} = await sb.from('subscribers').select('*');
    const {data: ships} = await sb.from('shipments').select('*');
    subscribers = subs || [];
    shipments = ships || [];
    updateCounts();
  } catch(e) {
    console.error('❌ Erreur chargement:', e.message);
  }
}

async function saveSubscriber(e) {
  e.preventDefault();
  const fname = $('fname').value.trim();
  const lname = $('lname').value.trim();
  const email = $('email').value.trim() || null;
  const addr = $('addr').value.trim() || null;
  
  try {
    const {data, error} = await sb.from('subscribers').insert([{
      first_name: fname,
      last_name: lname,
      email,
      address: addr
    }]).select();
    
    if(error) throw error;
    subscribers.push(data[0]);
    $('fname').value = '';
    $('lname').value = '';
    $('email').value = '';
    $('addr').value = '';
    closeModal('addModal');
    updateCounts();
    renderAbonnes();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

function openEdit(id) {
  editingSubId = id;
  const sub = subscribers.find(s => s.id === id);
  $('edit_fname').value = sub.first_name || '';
  $('edit_lname').value = sub.last_name || '';
  $('edit_email').value = sub.email || '';
  $('edit_addr').value = sub.address || '';
  $('editModal').classList.add('open');
}

async function updateSubscriber(e) {
  e.preventDefault();
  const fname = $('edit_fname').value.trim();
  const lname = $('edit_lname').value.trim();
  const email = $('edit_email').value.trim() || null;
  const addr = $('edit_addr').value.trim() || null;
  
  try {
    await sb.from('subscribers').update({
      first_name: fname,
      last_name: lname,
      email,
      address: addr
    }).eq('id', editingSubId);
    
    const sub = subscribers.find(s => s.id === editingSubId);
    sub.first_name = fname;
    sub.last_name = lname;
    sub.email = email;
    sub.address = addr;
    closeModal('editModal');
    renderAbonnes();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

async function deleteSubscriber(id) {
  if(!confirm('Supprimer cet abonné et tous ses envois?')) return;
  try {
    await sb.from('subscribers').delete().eq('id', id);
    subscribers = subscribers.filter(s => s.id !== id);
    shipments = shipments.filter(s => s.subscriber_id !== id);
    closeModal('editModal');
    updateCounts();
    renderAbonnes();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

function updateCounts() {
  $('cntAbo').textContent = subscribers.length;
  const pending = shipments.filter(s => !s.sent_at).length;
  $('cntEnv').textContent = pending;
}

function closeModal(id) {
  $(id).classList.remove('open');
}

function openModal(id) {
  $(id).classList.add('open');
}

function goView(v) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  event.target.closest('.nav-btn').classList.add('on');
  if(v === 'dashboard') renderDash();
  else if(v === 'abonnes') renderAbonnes();
  else if(v === 'envois') renderEnvois();
  else if(v === 'settings') renderSettings();
}

function renderDash() {
  $('content').innerHTML = `
    <div class="head"><h1>📊 Dashboard</h1><p>Vue d'ensemble</p></div>
    <div class="glass grid g-4">
      <div class="kpi">
        <div class="lab">Total abonnés</div>
        <div class="val">${subscribers.length}</div>
      </div>
      <div class="kpi">
        <div class="lab">Envois en attente</div>
        <div class="val">${shipments.filter(s => !s.sent_at).length}</div>
      </div>
      <div class="kpi">
        <div class="lab">Envois envoyés</div>
        <div class="val">${shipments.filter(s => s.sent_at).length}</div>
      </div>
    </div>
  `;
}

function renderAbonnes() {
  $('content').innerHTML = `
    <div class="head">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div><h1>👥 Abonnés</h1><p>${subscribers.length} abonnés enregistrés</p></div>
        <button class="btn pri" onclick="openModal('addModal')">+ Ajouter</button>
      </div>
    </div>
    <div class="glass">
      <table class="tbl">
        <thead><tr><th>Nom</th><th>Email</th><th>Adresse</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>${subscribers.map(s=>`<tr>
          <td class="nm">${s.first_name} ${s.last_name}</td>
          <td style="color:var(--ink-3);font-size:11.5px">${s.email||'—'}</td>
          <td style="color:var(--ink-3);font-size:11.5px">${s.address||'—'}</td>
          <td style="text-align:right;display:flex;gap:6px;justify-content:flex-end">
            <button class="action-btn" onclick="openEdit('${s.id}')">✎ Modifier</button>
            <button class="action-btn danger" onclick="deleteSubscriber('${s.id}')">✕ Supprimer</button>
          </td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  `;
}

function renderEnvois() {
  const byMonth = {};
  shipments.forEach(s => {
    const key = s.scheduled_date.slice(0, 7);
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(s);
  });

  let html = `<div class="head"><h1>📦 Envois</h1><p>Historique par mois</p></div>`;
  
  Object.keys(byMonth).sort().forEach(month => {
    const m = new Date(month + '-01').toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
    html += `<div class="glass" style="margin-bottom:16px">
      <div style="font-weight:700;margin-bottom:12px">${m}</div>
      <table class="tbl">
        <thead><tr><th>Abonné</th><th>Mag</th><th>Poster</th><th>Stickers</th><th>Statut</th><th style="text-align:right">Action</th></tr></thead>
        <tbody>${byMonth[month].map(ship => {
          const sub = subscribers.find(x => x.id === ship.subscriber_id);
          return `<tr>
            <td class="nm">${sub.first_name} ${sub.last_name}</td>
            <td>#${ship.magazine_number}</td>
            <td>#${ship.poster_number}</td>
            <td>${ship.sticker_pair_start}-${ship.sticker_pair_end}</td>
            <td><span class="pill ${ship.sent_at ? '' : 'o'}">${ship.sent_at ? '✅ Envoyé' : '⏳ Attente'}</span></td>
            <td style="text-align:right">${ship.sent_at ? 
              `<button class="btn sm" onclick="markUnsent('${ship.id}')">↶</button>` :
              `<button class="btn sm" onclick="markSent('${ship.id}')">✓</button>`
            }</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  });
  
  $('content').innerHTML = html;
}

async function markSent(shipId) {
  try {
    await sb.from('shipments').update({sent_at: new Date().toISOString()}).eq('id', shipId);
    const ship = shipments.find(s => s.id === shipId);
    ship.sent_at = new Date().toISOString();
    updateCounts();
    renderEnvois();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

async function markUnsent(shipId) {
  try {
    await sb.from('shipments').update({sent_at: null}).eq('id', shipId);
    const ship = shipments.find(s => s.id === shipId);
    ship.sent_at = null;
    updateCounts();
    renderEnvois();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

function renderSettings() {
  $('content').innerHTML = `
    <div class="head"><h1>⚙️ Paramètres</h1><p>Configuration</p></div>
    <div class="glass" style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:13px;font-weight:700">👤 Compte</div>
        <div style="font-size:12px;color:var(--ink-3);margin-top:4px">paul@sen-no-sen.com</div>
      </div>
      <button class="btn" onclick="sb.auth.signOut(); location.reload()">📴 Déconnexion</button>
    </div>
  `;
}
</script>

</body>
</html>
