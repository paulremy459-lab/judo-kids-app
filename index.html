<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Judo Kids - Gestion des Envois</title>
<style>
:root {
  --navy-900: #040A15;
  --accent: #7C5CFF;
  --accent-soft: #AF52DE;
  --success: #32D74B;
  --danger: #FF453A;
  --ink: #F2F6FF;
  --ink-2: rgba(242,246,255,.66);
  --ink-3: rgba(242,246,255,.42);
  --glass: rgba(255,255,255,.055);
  --glass-2: rgba(255,255,255,.085);
  --glass-hi: rgba(255,255,255,.14);
  --stroke: rgba(255,255,255,.10);
  --stroke-2: rgba(255,255,255,.18);
  --r-sm: 14px;
  --r-md: 20px;
  --r-lg: 26px;
  --shadow-md: 0 12px 34px rgba(0,0,0,.38);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: system-ui, sans-serif; background: var(--navy-900); color: var(--ink); overflow: hidden; }

.auth-screen { display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; flex-direction: column; gap: 20px; }
.auth-screen.hidden { display: none; }

.login-box { background: var(--glass-2); border: 1px solid var(--stroke); border-radius: var(--r-md); padding: 28px; width: 90%; max-width: 400px; box-shadow: var(--shadow-md); }
.login-box h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.login-box p { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 10px 12px; background: rgba(0,0,0,.2); border: 1px solid var(--stroke); border-radius: var(--r-sm); color: var(--ink); font-size: 14px; font-family: inherit; }
.form-group input:focus { outline: none; border-color: var(--accent); }

.btn { width: 100%; padding: 11px; background: linear-gradient(145deg, var(--accent), var(--accent-soft)); border: none; border-radius: var(--r-sm); color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.error-msg { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }

.app-root { display: grid; grid-template-columns: 280px 1fr; gap: 20px; padding: 20px; height: 100%; overflow: hidden; }
.app-root.hidden { display: none; }

aside { display: flex; flex-direction: column; gap: 20px; overflow: auto; }
.logo { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--glass); border-radius: var(--r-md); }
.logo-ico { width: 40px; height: 40px; border-radius: var(--r-sm); background: linear-gradient(145deg, var(--accent), #5D3FA6); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; }
.logo h1 { font-size: 16px; font-weight: 700; }

.nav-sec { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink-3); padding: 12px 0 4px; }
.nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r-sm); background: transparent; color: var(--ink-2); border: 1px solid transparent; cursor: pointer; width: 100%; text-align: left; font-weight: 580; }
.nav-btn:hover { background: var(--glass-2); }
.nav-btn.on { background: var(--glass-hi); border-color: var(--stroke-2); color: var(--ink); }

main { display: flex; flex-direction: column; gap: 18px; overflow: auto; }
.head h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.head p { font-size: 13px; color: var(--ink-3); }

.glass { background: linear-gradient(158deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.018) 42%, rgba(255,255,255,.045) 100%); backdrop-filter: blur(42px); border: 1px solid rgba(255,255,255,.15); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding: 20px; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.kpi { display: flex; flex-direction: column; gap: 10px; }
.kpi .lab { font-size: 12px; color: var(--ink-3); }
.kpi .val { font-size: 32px; font-weight: 700; }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 620; color: var(--ink-2); padding: 10px; background: rgba(0,0,0,.2); border-bottom: 1px solid var(--stroke); }
.tbl td { padding: 11px 10px; border-top: 1px solid var(--stroke); }
.tbl tbody tr:hover { background: var(--glass-2); }

.btn-small { padding: 6px 11px; border-radius: var(--r-sm); border: 1px solid var(--stroke); background: var(--glass-2); color: var(--ink); cursor: pointer; font-weight: 580; font-size: 12px; }
.btn-small:hover { background: var(--glass-hi); }

.pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(50,215,75,.15); color: var(--success); border: 1px solid rgba(50,215,75,.25); }
.pill.pending { background: rgba(255,212,38,.15); color: #FFD426; border-color: rgba(255,212,38,.25); }

.search-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--glass-2); border: 1px solid var(--stroke); border-radius: var(--r-md); margin-bottom: 16px; }
.search-box input { flex: 1; background: transparent; border: none; color: var(--ink); font-size: 14px; outline: none; }
.search-box input::placeholder { color: var(--ink-3); }

.loading { text-align: center; padding: 40px; color: var(--ink-3); }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="login-box">
    <div style="text-align: center; margin-bottom: 20px;">
      <div style="width: 60px; height: 60px; background: linear-gradient(145deg, var(--accent), #5D3FA6); border-radius: var(--r-md); display: grid; place-items: center; margin: 0 auto; color: #fff; font-size: 32px; font-weight: 700;">🥋</div>
      <h1 style="margin-top: 12px;">L'Esprit du Judo</h1>
      <p style="color: var(--ink-3); font-size: 13px; margin-top: 4px;">Gestion des Envois</p>
    </div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="paul@sen-no-sen.com" required autofocus>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn" id="submitBtn">Se connecter</button>
    </form>
  </div>
</div>

<div class="app-root hidden" id="appRoot">
  <aside>
    <div class="logo">
      <div class="logo-ico">🥋</div>
      <h1>Judo Kids</h1>
    </div>
    <div style="flex: 1;">
      <div class="nav-sec">MENU</div>
      <button class="nav-btn on" onclick="switchView('dash')">📊 Dashboard</button>
      <button class="nav-btn" onclick="switchView('abonnes')">👥 Abonnés</button>
      <button class="nav-btn" onclick="switchView('envois')">📮 Envois</button>
      <button class="nav-btn" onclick="switchView('settings')">⚙️ Paramètres</button>
    </div>
    <button class="nav-btn" style="color: var(--danger);" onclick="handleLogout()">🚪 Déconnexion</button>
  </aside>

  <main>
    <div id="content" style="flex: 1; overflow: auto;">
      <div class="loading">Chargement...</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://klbftabestrvyvmqcjca.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsYmZ0YWJlc3Rydnl2bXFjamNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTcwOTIsImV4cCI6MjEwNTY3MzA5Mn0.2pcg1B7Nh20HXM6A7uaH3nz6jWCNk9CReP7A_tgVum0';

let sb = null;
let state = { user: null, subs: [], ships: [] };

const SCHEDULE = [
  {mag:4, release:'2026-09-01'}, {mag:5, release:'2026-11-01'}, {mag:6, release:'2027-01-01'}, {mag:7, release:'2027-03-01'},
  {mag:8, release:'2027-05-01'}, {mag:9, release:'2027-07-01'}, {mag:10, release:'2027-09-01'}, {mag:11, release:'2027-11-01'},
  {mag:12, release:'2028-01-01'}, {mag:13, release:'2028-03-01'}, {mag:14, release:'2028-05-01'}, {mag:15, release:'2028-07-01'},
  {mag:16, release:'2028-09-01'}, {mag:17, release:'2028-11-01'}, {mag:18, release:'2029-01-01'}, {mag:19, release:'2029-03-01'},
  {mag:20, release:'2029-05-01'}, {mag:21, release:'2029-07-01'}
];

function init() {
  try {
    sb = window.supabase.createClient(SB_URL, SB_KEY);
    console.log('✅ Supabase initialized');
  } catch(e) {
    alert('Erreur: ' + e.message);
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errorMsg');
  
  if (!email || !pass) {
    err.textContent = 'Email et mot de passe requis';
    err.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Connexion...';
  err.style.display = 'none';
  
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    
    state.user = data.user;
    console.log('✅ Login:', data.user.email);
    
    await loadData();
    
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    
    renderDash();
  } catch(e) {
    err.textContent = 'Erreur: ' + (e.message || e);
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}

async function loadData() {
  try {
    const uid = state.user.id;
    const [{ data: subs }, { data: ships }] = await Promise.all([
      sb.from('subscribers').select('*').eq('user_id', uid),
      sb.from('shipments').select('*').eq('user_id', uid).order('scheduled_date')
    ]);
    state.subs = subs || [];
    state.ships = ships || [];
    console.log('✅ Data:', state.subs.length, 'subs,', state.ships.length, 'ships');
  } catch(e) {
    alert('Erreur loadData: ' + e.message);
  }
}

function renderDash() {
  const sent = state.ships.filter(s => s.sent_at).length;
  document.getElementById('content').innerHTML = `
    <div style="margin-bottom: 24px;">
      <h1>📊 Dashboard</h1>
      <p>Vue d'ensemble</p>
    </div>
    <div class="grid">
      <div class="glass kpi">
        <div class="lab">👥 Abonnés</div>
        <div class="val">${state.subs.length}</div>
      </div>
      <div class="glass kpi">
        <div class="lab">📮 En attente</div>
        <div class="val">${state.ships.length - sent}</div>
      </div>
      <div class="glass kpi">
        <div class="lab">✅ Envoyés</div>
        <div class="val">${sent}</div>
      </div>
    </div>
  `;
  updateNav('dash');
}

function renderAbonnes() {
  document.getElementById('content').innerHTML = `
    <div style="margin-bottom: 16px;">
      <h1>👥 Abonnés (${state.subs.length})</h1>
    </div>
    <div class="glass">
      <table class="tbl">
        <thead><tr><th>Nom</th><th>Email</th><th>Depuis</th></tr></thead>
        <tbody>
          ${state.subs.map(s => `<tr>
            <td>${s.first_name} ${s.last_name}</td>
            <td style="color: var(--ink-3); font-size: 12px;">${s.email || '—'}</td>
            <td style="font-size: 12px;">${s.subscription_date}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  updateNav('abonnes');
}

function renderEnvois() {
  document.getElementById('content').innerHTML = `
    <div style="margin-bottom: 16px;">
      <h1>📮 Envois (${state.ships.length})</h1>
    </div>
    <div class="glass">
      <table class="tbl">
        <thead><tr><th>Abonné</th><th>Mag</th><th>Poster</th><th>Stickers</th><th>Date</th><th>Statut</th></tr></thead>
        <tbody>
          ${state.ships.slice(0, 20).map(s => {
            const sub = state.subs.find(x => x.id === s.subscriber_id);
            return `<tr>
              <td>${sub?.first_name} ${sub?.last_name}</td>
              <td>#${s.magazine_number}</td>
              <td>#${s.poster_number}</td>
              <td>#${s.sticker_pair_start}-${s.sticker_pair_end}</td>
              <td style="font-size: 12px;">${s.scheduled_date}</td>
              <td><span class="pill ${s.sent_at ? '' : 'pending'}">${s.sent_at ? '✅ Envoyé' : '⏳ Attente'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  updateNav('envois');
}

function renderSettings() {
  document.getElementById('content').innerHTML = `
    <div style="margin-bottom: 16px;">
      <h1>⚙️ Paramètres</h1>
    </div>
    <div class="glass">
      <div style="color: var(--ink-3); font-size: 12px; margin-bottom: 8px;">Utilisateur</div>
      <div style="font-weight: 700; margin-bottom: 16px;">${state.user?.email}</div>
      <button class="btn-small" onclick="handleLogout()" style="color: var(--danger);">Déconnexion</button>
    </div>
  `;
  updateNav('settings');
}

function switchView(v) {
  if (v === 'dash') renderDash();
  else if (v === 'abonnes') renderAbonnes();
  else if (v === 'envois') renderEnvois();
  else renderSettings();
}

function updateNav(v) {
  document.querySelectorAll('.nav-btn').forEach((b, i) => {
    b.classList.toggle('on', (i === {dash:0, abonnes:1, envois:2, settings:3}[v]));
  });
}

async function handleLogout() {
  await sb.auth.signOut();
  state = { user: null, subs: [], ships: [] };
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.querySelector('form').reset();
}

window.addEventListener('load', async () => {
  init();
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.user = session.user;
    await loadData();
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    renderDash();
  }
});
</script>
</body>
</html>
