*{margin:0;padding:0;box-sizing:border-box}

select {

<script>
// ===== CONFIGURATION GOOGLE SHEETS =====
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzG5ZG2AMlEP64jILIzdtpj3aAEdXdGcYYITFeRMYeVx84ixAynQvlTheprasWW7SMJ/exec';

// Fonction pour synchroniser les données avec Google Sheets
async function syncToGoogleSheets(data) {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === 'TON_URL_ICI') {
    console.log('Google Sheets non configuré');
    return false;
  }
  
  try {
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(data)
    });
    
    const result = await response.json();
    console.log('Sync Google Sheets:', result);
    return result.success;
  } catch (error) {
    console.error('Erreur sync Google Sheets:', error);
    return false;
  }
}

// DONNÉES LOCALES
let subscribers = [];

// Calendrier avec dates de SORTIE (le 1er) et DEADLINES (le 15 du mois suivant)
const SCHEDULE = [
  {shipment:1, mag_if_sub_before_deadline:4, release_date:'2026-09-01', deadline:'2026-10-15'},
  {shipment:2, mag_if_sub_before_deadline:5, release_date:'2026-11-01', deadline:'2026-12-15'},
  {shipment:3, mag_if_sub_before_deadline:6, release_date:'2027-01-01', deadline:'2027-02-15'},
  {shipment:4, mag_if_sub_before_deadline:7, release_date:'2027-03-01', deadline:'2027-04-15'},
  {shipment:5, mag_if_sub_before_deadline:8, release_date:'2027-05-01', deadline:'2027-06-15'},
  {shipment:6, mag_if_sub_before_deadline:9, release_date:'2027-07-01', deadline:'2027-08-15'},
  {shipment:7, mag_if_sub_before_deadline:10, release_date:'2027-09-01', deadline:'2027-10-15'},
  {shipment:8, mag_if_sub_before_deadline:11, release_date:'2027-11-01', deadline:'2027-12-15'},
  {shipment:9, mag_if_sub_before_deadline:12, release_date:'2028-01-01', deadline:'2028-02-15'},
  {shipment:10, mag_if_sub_before_deadline:13, release_date:'2028-03-01', deadline:'2028-04-15'},
  {shipment:11, mag_if_sub_before_deadline:14, release_date:'2028-05-01', deadline:'2028-06-15'},
  {shipment:12, mag_if_sub_before_deadline:15, release_date:'2028-07-01', deadline:'2028-08-15'},
  {shipment:13, mag_if_sub_before_deadline:16, release_date:'2028-09-01', deadline:'2028-10-15'},
  {shipment:14, mag_if_sub_before_deadline:17, release_date:'2028-11-01', deadline:'2028-12-15'},
  {shipment:15, mag_if_sub_before_deadline:18, release_date:'2029-01-01', deadline:'2029-02-15'},
  {shipment:16, mag_if_sub_before_deadline:19, release_date:'2029-03-01', deadline:'2029-04-15'},
  {shipment:17, mag_if_sub_before_deadline:20, release_date:'2029-05-01', deadline:'2029-06-15'},
  {shipment:18, mag_if_sub_before_deadline:21, release_date:'2029-07-01', deadline:'2029-08-15'},
];

// Fonction: récupérer le magazine de premier envoi selon la date d'abonnement
// Si date d'abonnement <= 15 du mois suivant la parution = Mag EN COURS
// Si date d'abonnement > 15 du mois suivant la parution = Mag D'APRÈS
function getMagazineForSubscription(subDate){
  const subDateObj = new Date(subDate);
  
  // Trouver le premier magazine auquel on a droit selon la deadline
  for(let i = 0; i < SCHEDULE.length; i++){
    const deadlineDate = new Date(SCHEDULE[i].deadline);
    
    // Si la date d'abonnement est <= deadline, on a droit à ce magazine
    if(subDateObj <= deadlineDate){
      return SCHEDULE[i].mag_if_sub_before_deadline;
    }
  }
  
  // Si après toutes les deadlines
  return SCHEDULE[SCHEDULE.length - 1].mag_if_sub_before_deadline + 1;
}

let shipments = [];

let nextSubId = 1;
let nextShipId = 1;
let editingSubId = null;
let theme = {
  accent: '#7C5CFF',
  accentSoft: '#AF52DE',
  accentDeep: '#5D3FA6',
  fond: 'marine', // marine, noir, navy, gradient
  verre: 'intense' // leger, moyen, intense
};

function applyTheme(){
  const root = document.documentElement;
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--accent-soft', theme.accentSoft);
  root.style.setProperty('--accent-deep', theme.accentDeep);
  
  // Appliquer le fond
  const fondMap = {
    marine: '#040A15',
    noir: '#0A0A0A',
    navy: '#0B1B33',
    gradient: 'linear-gradient(135deg, #040A15 0%, #0B1B33 100%)'
  };
  document.body.style.background = fondMap[theme.fond] || fondMap.marine;
  
  // Appliquer le verre (blur et opacity)
  const verreMap = {
    leger: { blur: '20px', opacity: 0.03 },
    moyen: { blur: '42px', opacity: 0.055 },
    intense: { blur: '60px', opacity: 0.08 }
  };
  const v = verreMap[theme.verre] || verreMap.moyen;
  root.style.setProperty('--blur', v.blur);
  root.style.setProperty('--glass', `rgba(255,255,255,${v.opacity})`);
  root.style.setProperty('--glass-2', `rgba(255,255,255,${v.opacity*1.5})`);
  root.style.setProperty('--glass-hi', `rgba(255,255,255,${v.opacity*2.5})`);
}

// Sauvegarder un abonné à Supabase
async function saveSubscriberToSupabase(subData, shipmentsList) {
  if(!sb) return;
  try {
    // Insérer l'abonné (Supabase génère l'ID)
    const {data: insertedSub, error: subError} = await sb
      .from('subscribers')
      .insert([subData])
      .select();
    
    if(subError) throw subError;
    const newId = insertedSub[0].id;
    
    // Mettre à jour les envois avec le vrai ID Supabase
    const shipsToInsert = shipmentsList.map(s => ({
      ...s,
      subscriber_id: newId
    }));
    
    const {error: shipError} = await sb
      .from('shipments')
      .insert(shipsToInsert);
    
    if(shipError) throw shipError;
    
    console.log('✅ Abonné sauvegardé à Supabase');
    return newId;
  } catch(e) {
    console.error('❌ Erreur Supabase:', e.message);
    return null;
  }
}

async function saveSubscriber(e){
  e.preventDefault();
  const fname = $('#fname').value;
  const lname = $('#lname').value;
  const email = $('#email').value || null;
  const addr = $('#addr').value || '';
  

  
  // Créer le sub SANS ID (Supabase va le générer)
  const subToInsert = {
    first_name: fname,
    last_name: lname,
    email,
    address: addr
  };
  
  // Insérer à Supabase EN PREMIER pour obtenir l'ID généré
  let subId;
  if(sb) {
    try {
      const {data: insertedSubs, error} = await sb
        .from('subscribers')
        .insert([subToInsert])
        .select();
      
      if(error) throw error;
      subId = insertedSubs[0].id;
      console.log('✅ Abonné sauvegardé dans Supabase (ID:', subId, ')');
    } catch(e) {
      console.error('❌ Erreur Supabase:', e.message);
      alert('Erreur de sauvegarde: ' + e.message);
      return;
    }
  } else {
    subId = nextSubId++;
  }
  
  // Créer l'objet local avec l'ID Supabase
  const sub = {...subToInsert, id: subId};
  subscribers.push(sub);
  
  $('#fname').value = '';
  $('#lname').value = '';
  $('#email').value = '';
  $('#addr').value = '';
  closeModal('addModal');
  
  const pending = shipments.filter(s=>!s.sent_at).length;
  $('#cntAbo').textContent = subscribers.length;
  $('#cntEnv').textContent = pending;
  renderAbonnes();
}

function editSubscriber(id){
  editingSubId = id;
  const sub = subscribers.find(s=>s.id===id);
  $('#edit_fname').value = sub.first_name;
  $('#edit_lname').value = sub.last_name;
  $('#edit_email').value = sub.email || '';
  $('#edit_addr').value = sub.address || '';
  openModal('editModal');
}

function updateSubscriber(e){
  e.preventDefault();
  const sub = subscribers.find(s=>s.id===editingSubId);
  sub.first_name = $('#edit_fname').value;
  sub.last_name = $('#edit_lname').value;
  sub.email = $('#edit_email').value || null;
  sub.address = $('#edit_addr').value || '';
  
  // Sauvegarder les modifications à Supabase en arrière-plan
  if(sb) {
    (async () => {
      try {
        await sb.from('subscribers').update(sub).eq('id', editingSubId);
        console.log('✅ Abonné mis à jour');
      } catch(e) {
        console.error('❌ Erreur update:', e.message);
      }
    })();
  }
  
  const newSubDate = $('#edit_sub_date').value;
  const newSubDateObj = new Date(newSubDate);
  const newSubDuration = parseInt($('#edit_sub_duration').value);
  const firstMag = getMagazineForSubscription(newSubDate);
  
  // Supprimer les anciens envois
  const oldShips = shipments.filter(s=>s.subscriber_id===editingSubId);
  shipments = shipments.filter(s=>s.subscriber_id!==editingSubId);
  
  // Supprimer à Supabase aussi
  if(sb && oldShips.length > 0) {
    (async () => {
      try {
        const shipIds = oldShips.map(s => s.id);
        await sb.from('shipments').delete().in('id', shipIds);
        console.log('✅ Anciens envois supprimés');
      } catch(e) {
        console.error('❌ Erreur delete ships:', e.message);
      }
    })();
  }
  
  // Trouver le SCHEDULE correspondant au premier magazine
  let firstScheduleIdx = -1;
  for(let i = 0; i < SCHEDULE.length; i++){
    if(SCHEDULE[i].mag_if_sub_before_deadline === firstMag){
      firstScheduleIdx = i;
      break;
    }
  }
  
  // Créer les nouveaux envois
  const newShips = [];
  if(firstScheduleIdx >= 0){
    const endDate = new Date(newSubDateObj);
    endDate.setFullYear(endDate.getFullYear() + newSubDuration);
    
    let shipmentNum = 1;
    const maxShipments = 6 * newSubDuration;  // 6 envois par an
    
    // PREMIER ENVOI: date de sortie du magazine OU date d'abonnement, prendre la plus grande
    const releaseDate = new Date(SCHEDULE[firstScheduleIdx].release_date);
    const firstShipmentDate = newSubDateObj >= releaseDate ? newSubDate : SCHEDULE[firstScheduleIdx].release_date;
    
    shipments.push({
      id: nextShipId++,
      subscriber_id: editingSubId,
      shipment_number: shipmentNum,
      magazine_number: SCHEDULE[firstScheduleIdx].mag_if_sub_before_deadline,
      poster_number: shipmentNum,
      sticker_pair: shipmentNum,
      scheduled_date: firstShipmentDate,  // ← Max(date d'abonnement, date de sortie)
      sent_at: null
    });
    shipmentNum++;
    
    // ENVOIS SUIVANTS: dates de sortie
    for(let i = firstScheduleIdx + 1; i < SCHEDULE.length && shipmentNum <= maxShipments; i++){
      const sendDate = new Date(SCHEDULE[i].release_date);
      
      if(sendDate <= endDate){
        shipments.push({
          id: nextShipId++,
          subscriber_id: editingSubId,
          shipment_number: shipmentNum,
          magazine_number: SCHEDULE[i].mag_if_sub_before_deadline,
          poster_number: shipmentNum,
          sticker_pair: shipmentNum,
          scheduled_date: SCHEDULE[i].release_date,  // ← Date de sortie
          sent_at: null
        });
        shipmentNum++;
      }
    }
  }
  
  // Insérer les nouveaux envois à Supabase
  const modifiedShipments = shipments.filter(s => s.subscriber_id === editingSubId);
  if(sb && modifiedShipments.length > 0) {
    const shipsForSupabase = modifiedShipments.map(s => ({
      subscriber_id: s.subscriber_id,
      shipment_number: s.shipment_number,
      magazine_number: s.magazine_number,
      poster_number: s.poster_number,
      sticker_pair: s.sticker_pair,
      scheduled_date: s.scheduled_date,
      sent_at: s.sent_at
    }));
    
    (async () => {
      try {
        await sb.from('shipments').insert(shipsForSupabase);
        console.log('✅ Nouveaux envois sauvegardés');
      } catch(e) {
        console.error('❌ Erreur insert nouveaux ships:', e.message);
      }
    })();
  }
  
  // Synchroniser avec Google Sheets
  syncToGoogleSheets({
    action: 'updateSubscriber',
    id: sub.id,
    first_name: sub.first_name,
    last_name: sub.last_name,
    email: sub.email,
    address: sub.address
  });
  
  // Synchroniser les envois modifiés
  const modifiedShipments2 = shipments.filter(s => s.subscriber_id === editingSubId);
  modifiedShipments2.forEach(ship => {
    syncToGoogleSheets({
      action: 'addShipment',
      id: ship.id,
      subscriber_id: ship.subscriber_id,
      shipment_number: ship.shipment_number,
      magazine_number: ship.magazine_number,
      poster_number: ship.poster_number,
      sticker_pair_start: ship.sticker_pair_start,
      sticker_pair_end: ship.sticker_pair_end,
      scheduled_date: ship.scheduled_date,
      sent_at: ship.sent_at
    });
  });
  
  closeModal('editModal');
  updateCounts();
  renderAbonnes();
}

function deleteSubscriber(id){

  if(!confirm('Supprimer cet abonné et tous ses envois?')) return;
  
  const sub = subscribers.find(s=>s.id===id);
  
  // Supprimer à Supabase
  if(sb) {
    (async () => {
      try {
        // Les shipments se suppriment en cascade grâce aux FK
        await sb.from('subscribers').delete().eq('id', id);
        console.log('✅ Abonné supprimé');
      } catch(e) {
        console.error('❌ Erreur delete:', e.message);
      }
    })();
  }
  
  // Synchroniser la suppression avec Google Sheets
  syncToGoogleSheets({
    action: 'deleteSubscriber',
    id: id
  });
  
  subscribers = subscribers.filter(s=>s.id!==id);
  shipments = shipments.filter(s=>s.subscriber_id!==id);
  updateCounts();
  renderAbonnes();
}

let renewingSubId = null;

function renewSubscription(id){

  renewingSubId = id;
  const sub = subscribers.find(s=>s.id===id);
  
  // Date de départ par défaut = 1 an après la date d'abonnement précédente
  const prevSubDate = new Date(sub.subscription_date);
  const renewalDate = new Date(prevSubDate);
  renewalDate.setFullYear(renewalDate.getFullYear() + sub.subscription_duration);
  
  $('#renew_sub_date').value = renewalDate.toISOString().split('T')[0];
  $('#renew_sub_duration').value = '1';
  
  openModal('renewModal');
}

function confirmRenewal(e){
  e.preventDefault();
  const sub = subscribers.find(s=>s.id===renewingSubId);
  const renewalDate = $('#renew_sub_date').value;
  const renewalDuration = parseInt($('#renew_sub_duration').value);
  const renewalDateObj = new Date(renewalDate);
  
  // Trouver le dernier envoi de cet abonné pour continuer les numéros
  const lastShipment = shipments.filter(s=>s.subscriber_id===renewingSubId).sort((a,b)=>b.shipment_number-a.shipment_number)[0];
  
  const lastMagazineNum = lastShipment ? lastShipment.magazine_number : sub.subscription_duration * 6 + 3;  // Mag actuel après abonnement
  const lastPosterNum = lastShipment ? lastShipment.poster_number : 6;
  const lastStickerPair = lastShipment ? lastShipment.sticker_pair : 6;
  
  // Trouver le SCHEDULE pour le nouveau magazine
  const firstNewMag = lastMagazineNum + 1;
  let firstNewScheduleIdx = -1;
  for(let i = 0; i < SCHEDULE.length; i++){
    if(SCHEDULE[i].mag_if_sub_before_deadline === firstNewMag){
      firstNewScheduleIdx = i;
      break;
    }
  }
  
  if(firstNewScheduleIdx >= 0){
    const endDate = new Date(renewalDateObj);
    endDate.setFullYear(endDate.getFullYear() + renewalDuration);
    
    let shipmentNum = 1;
    const maxShipments = 6 * renewalDuration;
    let magazineNum = firstNewMag;
    let posterNum = lastPosterNum + 1;
    let stickerPair = lastStickerPair + 1;
    
    // PREMIER ENVOI du renouvellement
    const releaseDate = new Date(SCHEDULE[firstNewScheduleIdx].release_date);
    const firstShipmentDate = renewalDateObj >= releaseDate ? renewalDate : SCHEDULE[firstNewScheduleIdx].release_date;
    
    shipments.push({
      id: nextShipId++,
      subscriber_id: renewingSubId,
      shipment_number: lastShipment ? lastShipment.shipment_number + 1 : 1,
      magazine_number: magazineNum,
      poster_number: posterNum,
      sticker_pair: stickerPair,
      scheduled_date: firstShipmentDate,
      sent_at: null
    });
    
    shipmentNum++;
    magazineNum++;
    posterNum++;
    stickerPair++;
    
    // ENVOIS SUIVANTS du renouvellement
    for(let i = firstNewScheduleIdx + 1; i < SCHEDULE.length && shipmentNum <= maxShipments; i++){
      const sendDate = new Date(SCHEDULE[i].release_date);
      
      if(sendDate <= endDate){
        shipments.push({
          id: nextShipId++,
          subscriber_id: renewingSubId,
          shipment_number: (lastShipment ? lastShipment.shipment_number : 0) + shipmentNum,
          magazine_number: magazineNum,
          poster_number: posterNum,
          sticker_pair: stickerPair,
          scheduled_date: SCHEDULE[i].release_date,
          sent_at: null
        });
        shipmentNum++;
        magazineNum++;
        posterNum++;
        stickerPair++;
      }
    }
  }
  
  // Synchroniser les nouveaux envois du renouvellement
  const renewalShipments = shipments.filter(s => 
    s.subscriber_id === renewingSubId && 
    s.shipment_number > (lastShipment ? lastShipment.shipment_number : 0)
  );
  
  renewalShipments.forEach(ship => {
    syncToGoogleSheets({
      action: 'addShipment',
      id: ship.id,
      subscriber_id: ship.subscriber_id,
      shipment_number: ship.shipment_number,
      magazine_number: ship.magazine_number,
      poster_number: ship.poster_number,
      sticker_pair_start: ship.sticker_pair_start,
      sticker_pair_end: ship.sticker_pair_end,
      scheduled_date: ship.scheduled_date,
      sent_at: ship.sent_at
    });
  });
  
  closeModal('renewModal');
  updateCounts();
  viewSubscriberProfile(renewingSubId);
}

function updateCounts(){
  // Trouver le magazine en cours (le plus récent dont la deadline n'a pas passée, ou le dernier)
  const today = new Date();
  let currentMag = SCHEDULE[SCHEDULE.length - 1].mag_if_sub_before_deadline;
  
  for(let sched of SCHEDULE){
    if(new Date(sched.release_date) <= today){
      currentMag = sched.mag_if_sub_before_deadline;
    } else {
      break;
    }
  }
  
  // Compter les envois du magazine courant qui ne sont pas envoyés
  const pendingCurrentMag = shipments.filter(s=>
    s.magazine_number === currentMag && !s.sent_at
  ).length;
  
  $('#cntAbo').textContent = subscribers.length;
  $('#cntEnv').textContent = pendingCurrentMag;
}

function markSentFromProfile(shipId){

  if(!confirm('Marquer cet envoi comme envoyé?')) return;
  const ship = shipments.find(s=>s.id===shipId);
  ship.sent_at = new Date().toISOString();
  const subId = ship.subscriber_id;
  
  // Sauvegarder à Supabase
  if(sb) {
    (async () => {
      try {
        await sb.from('shipments').update({sent_at: ship.sent_at}).eq('id', shipId);
      } catch(e) {
        console.error('❌ Erreur update:', e.message);
      }
    })();
  }
  
  syncToGoogleSheets({
    action: 'updateShipment',
    id: ship.id,
    sent_at: ship.sent_at
  });
  
  updateCounts();
  viewSubscriberProfile(subId);
}

function unmarkSentFromProfile(shipId){

  if(!confirm('Annuler le statut "envoyé" pour cet envoi?')) return;
  const ship = shipments.find(s=>s.id===shipId);
  ship.sent_at = null;
  const subId = ship.subscriber_id;
  
  // Sauvegarder à Supabase
  if(sb) {
    (async () => {
      try {
        await sb.from('shipments').update({sent_at: null}).eq('id', shipId);
      } catch(e) {
        console.error('❌ Erreur update:', e.message);
      }
    })();
  }
  
  syncToGoogleSheets({
    action: 'updateShipment',
    id: ship.id,
    sent_at: null
  });
  
  updateCounts();
  viewSubscriberProfile(subId);
}

function getDefaultEnvoisMonth(){
  const now = new Date();
  const currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  
  // Si on est passé le 5e jour du mois suivant, afficher le mois suivant
  const dayOfMonth = now.getDate();
  if(dayOfMonth > 5){
    return currentMonth;
  } else {
    // Sinon afficher le mois précédent
    const prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
    return `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`;
  }
}

  } else if(byMonth[selectedMonth]){
    const m = new Date(selectedMonth+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});

      <div style="font-weight:700;margin-bottom:12px">${m}</div>

          return `<tr class="shipment-row" data-subscriber="${(sub.first_name + ' ' + sub.last_name).toLowerCase()}">
            <td class="nm" style="cursor:pointer;color:var(--accent)" onclick="openProfileModal('${sub.id}')">${sub.first_name} ${sub.last_name}</td>

            <td>#${ship.poster_number}</td>
            <td>${ship.sticker_pair_start}-${ship.sticker_pair_end}</td>
            <td><span class="pill ${ship.sent_at?'':'o'}">${ship.sent_at?'✅ Envoyé':'⏳ Attente'}</span></td>
            <td style="text-align:right">${ship.sent_at?`<button class="btn sm" onclick="unmarkSent('${ship.id}')" style="color:var(--warning)">✕</button>`:`<button class="btn sm" onclick="markSent('${ship.id}')">✓</button>`}</td>

    html += `<div class="glass"><p style="color:var(--ink-3);text-align:center;padding:40px 0">Aucun envoi pour ce mois</p></div>`;
  }
  
  $('#content').innerHTML = html;
}

function filterShipments(){
  const query = $('#shipmentsSearch').value.toLowerCase();
  const rows = document.querySelectorAll('.shipment-row');
  rows.forEach(row=>{
    const subscriber = row.dataset.subscriber;
    row.style.display = subscriber.includes(query) ? '' : 'none';
  });
}

function markSent(id){

  if(!confirm('Marquer cet envoi comme envoyé?')) return;
  const ship = shipments.find(s=>s.id===id);
  ship.sent_at = new Date().toISOString();
  
  // Sauvegarder à Supabase
  if(sb) {
    (async () => {
      try {
        await sb.from('shipments').update({sent_at: ship.sent_at}).eq('id', id);
        console.log('✅ Envoi marqué comme envoyé');
      } catch(e) {
        console.error('❌ Erreur update:', e.message);
      }
    })();
  }
  
  syncToGoogleSheets({
    action: 'updateShipment',
    id: ship.id,
    sent_at: ship.sent_at
  });
  
  updateCounts();
  renderEnvois();
}

function unmarkSent(id){

  if(!confirm('Annuler le statut "envoyé" pour cet envoi?')) return;
  const ship = shipments.find(s=>s.id===id);
  ship.sent_at = null;
  
  // Sauvegarder à Supabase
  if(sb) {
    (async () => {
      try {
        await sb.from('shipments').update({sent_at: null}).eq('id', id);
        console.log('✅ Statut annulé');
      } catch(e) {
        console.error('❌ Erreur update:', e.message);
      }
    })();
  }
  
  syncToGoogleSheets({
    action: 'updateShipment',
    id: ship.id,
    sent_at: null
  });
  
  updateCounts();
  renderEnvois();
}

function closeProfileModal(){
  const modal = document.getElementById('profileModal');
  if(modal) modal.remove();
}

function copyToClipboard(text){
  navigator.clipboard.writeText(text).then(()=>{
    alert('✓ Copié !');
  }).catch(()=>{
    // Fallback pour les anciens navigateurs
    const input = document.createElement('textarea');
    input.value = text;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    alert('✓ Copié !');
  });
}

function changeAccentColor(hex){
  if(/^#[0-9A-F]{6}$/i.test(hex)){
    theme.accent = hex;
    $('#accentColor').value = hex;
    $('#accentHex').value = hex;
    applyTheme();
  }
}

function setTheme(accent, soft, deep){
  theme.accent = accent;
  theme.accentSoft = soft;
  theme.accentDeep = deep;
  $('#accentColor').value = accent;
  $('#accentHex').value = accent;
  applyTheme();
}

function changeFond(fond){
  theme.fond = fond;
  applyTheme();
  renderSettings(); // Refresh pour voir la bordure active
}

function changeVerre(verre){
  theme.verre = verre;
  applyTheme();
  renderSettings(); // Refresh pour voir la bordure active
}

function exportData(){
  const data = {
    subscribers,
    shipments,
    exported_at: new Date().toISOString()
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'judo-kids-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ==== FONCTIONS AUTH SUPABASE ====
async function doLogin(e) {
  e.preventDefault();
  const email = $('#loginEmail').value;
  const pwd = $('#loginPassword').value;
  const errDiv = $('#loginError');
  
  if(!sb) {
    errDiv.textContent = 'Erreur Supabase';
    errDiv.style.display = 'block';
    return;
  }
  
  try {
    const {data, error} = await sb.auth.signInWithPassword({email, password: pwd});
    if(error) throw error;
    
    $('#loginScreen').style.display = 'none';
    await loadDataFromSupabase();
    renderDash();
    applyTheme();
  } catch(e) {
    errDiv.textContent = e.message || 'Erreur de connexion';
    errDiv.style.display = 'block';
  }
}

async function doLogout() {
  if(!confirm('Déconnecter?')) return;
  await sb.auth.signOut();
  subscribers = [];
  shipments = [];
  $('#loginScreen').style.display = 'flex';
  $('#loginEmail').value = '';
  $('#loginPassword').value = '';
  $('#loginError').style.display = 'none';
  $('#loginEmail').focus();
}

async function loadDataFromSupabase() {
  try {
    const { data: subs, error: subErr } = await sb.from('subscribers').select('*');
    if(subErr) throw subErr;
    subscribers = subs || [];
    
    const { data: ships, error: shipErr } = await sb.from('shipments').select('*');
    if(shipErr) throw shipErr;
    shipments = ships || [];
    
    console.log(`✅ ${subscribers.length} abonnés, ${shipments.length} envois chargés`);
  } catch(e) {
    console.error('❌ Erreur chargement:', e.message);
  }
}
