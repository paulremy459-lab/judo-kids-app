<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Judo Kids</title>
<style>
:root {
  --navy: #040A15;
  --accent: #7C5CFF;
  --ink: #F2F6FF;
  --ink-3: rgba(242,246,255,.42);
  --stroke: rgba(255,255,255,.10);
  --glass: rgba(255,255,255,.055);
  --glass-2: rgba(255,255,255,.085);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: system-ui, sans-serif; background: var(--navy); color: var(--ink); }

#root { display: grid; grid-template-columns: 280px 1fr; gap: 20px; padding: 20px; height: 100%; }
#loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; }

aside { display: flex; flex-direction: column; gap: 20px; overflow: auto; }
.logo { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--glass); border-radius: 14px; }
.logo .ico { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(145deg, var(--accent), #5D3FA6); display: grid; place-items: center; color: #fff; font-size: 18px; font-weight: 700; }
.logo h1 { font-size: 16px; font-weight: 700; }

.nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: transparent; color: var(--ink); border: 1px solid transparent; cursor: pointer; width: 100%; text-align: left; }
.nav-btn:hover { background: var(--glass-2); }
.nav-btn.on { background: var(--glass); border-color: var(--stroke); }
.nav-badge { background: var(--accent); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: auto; }

#content { overflow-y: auto; padding-right: 12px; }
.head { margin-bottom: 32px; }
.head h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.head p { font-size: 13px; color: var(--ink-3); }

.glass { background: var(--glass); border: 1px solid var(--stroke); border-radius: 20px; padding: 20px; margin-bottom: 24px; }
.btn { padding: 12px 24px; border: 1px solid var(--stroke); border-radius: 10px; background: var(--glass-2); color: var(--ink); cursor: pointer; font-size: 14px; font-weight: 600; }
.btn:hover { background: var(--glass); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #AF52DE; }
.btn-danger { background: rgba(255,69,58,.2); border-color: rgba(255,69,58,.4); color: #FF453A; }

input, select, textarea { padding: 12px; background: var(--glass-2); border: 1px solid var(--stroke); border-radius: 10px; color: var(--ink); font-size: 14px; width: 100%; margin-bottom: 12px; }
input:focus, select:focus { outline: none; border-color: var(--accent); }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.tbl th { padding: 12px; text-align: left; border-bottom: 1px solid var(--stroke); color: var(--ink-3); font-weight: 600; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--stroke); }
.tbl tr:hover { background: var(--glass-2); }

.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 999; }
.modal.open { display: flex; }
.modal-content { background: var(--navy); border: 1px solid var(--stroke); border-radius: 20px; padding: 32px; max-width: 500px; width: 90%; }
.modal-content h2 { margin-bottom: 24px; font-size: 20px; font-weight: 700; }
.modal-btns { display: flex; gap: 12px; margin-top: 24px; }
.modal-btns .btn { flex: 1; }

.pill { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--glass-2); }
.pill.g { background: rgba(50,215,75,.15); color: #32D74B; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="glass" style="width: 100%; max-width: 400px; padding: 40px;">
    <div class="logo" style="margin-bottom: 32px;">
      <div class="ico">🥋</div>
      <h1>Judo Kids</h1>
    </div>
    <form onsubmit="doLogin(event)">
      <h2 style="margin-bottom: 24px; font-size: 18px;">Connexion</h2>
      <label style="display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 6px;">Email</label>
      <input type="email" id="loginEmail" required>
      <label style="display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 6px;">Mot de passe</label>
      <input type="password" id="loginPassword" required>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px;">Se connecter</button>
    </form>
  </div>
</div>

<div id="root" style="display: none;">
  <aside>
    <div class="logo">
      <div class="ico">🥋</div>
      <h1>Judo Kids</h1>
    </div>
    <button class="nav-btn on" onclick="goView('dash')">📊 Dashboard</button>
    <button class="nav-btn" onclick="goView('subscribers')">👥 Abonnés <span class="nav-badge" id="subCount">0</span></button>
    <button class="nav-btn" onclick="goView('settings')">⚙️ Paramètres</button>
  </aside>
  
  <div id="content"></div>
</div>

<div id="modalAdd" class="modal">
  <div class="modal-content">
    <h2>➕ Ajouter un abonné</h2>
    <form onsubmit="saveSubscriber(event)">
      <label>Prénom *</label>
      <input type="text" id="fname" required>
      <label>Nom *</label>
      <input type="text" id="lname" required>
      <label>Email</label>
      <input type="email" id="email">
      <label>Adresse</label>
      <textarea id="addr" style="height: 80px;"></textarea>
      <div class="modal-btns">
        <button type="button" class="btn" onclick="closeModal('modalAdd')">Annuler</button>
        <button type="submit" class="btn btn-primary">Créer</button>
      </div>
    </form>
  </div>
</div>

<div id="modalEdit" class="modal">
  <div class="modal-content">
    <h2>✏️ Modifier</h2>
    <form onsubmit="updateSubscriber(event)">
      <label>Prénom *</label>
      <input type="text" id="edit_fname" required>
      <label>Nom *</label>
      <input type="text" id="edit_lname" required>
      <label>Email</label>
      <input type="email" id="edit_email">
      <label>Adresse</label>
      <textarea id="edit_addr" style="height: 80px;"></textarea>
      <div class="modal-btns">
        <button type="button" class="btn" onclick="closeModal('modalEdit')">Annuler</button>
        <button type="button" class="btn btn-danger" onclick="deleteSubscriber(editingSubId)">Supprimer</button>
        <button type="submit" class="btn btn-primary">Mettre à jour</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://klbftabestrvyvmqcjca.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsYmZ0YWJlc3Rydnl2bXFjamNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTcwOTIsImV4cCI6MjEwNTY3MzA5Mn0.2pcg1B7Nh20HXM6A7uaH3nz6jWCNk9CReP7A_tgVum0';

let sb = null;
let subscribers = [];
let editingSubId = null;

const $ = id => document.getElementById(id);

// Init
(async () => {
  if(window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const {data: {session}} = await sb.auth.getSession();
    if(session) {
      $('loginScreen').style.display = 'none';
      $('root').style.display = 'grid';
      await loadData();
      renderDash();
    }
  }
})();

async function doLogin(e) {
  e.preventDefault();
  const email = $('loginEmail').value;
  const pwd = $('loginPassword').value;
  try {
    await sb.auth.signInWithPassword({email, password: pwd});
    $('loginScreen').style.display = 'none';
    $('root').style.display = 'grid';
    await loadData();
    renderDash();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

async function loadData() {
  try {
    const {data: subs} = await sb.from('subscribers').select('*');
    subscribers = subs || [];
    updateCounts();
    console.log('✅ ' + subscribers.length + ' abonnés chargés');
  } catch(e) {
    console.error('❌ Erreur chargement:', e.message);
  }
}

async function saveSubscriber(e) {
  e.preventDefault();
  const fname = $('fname').value.trim();
  const lname = $('lname').value.trim();
  const email = $('email').value.trim();
  const addr = $('addr').value.trim();
  
  try {
    const {data, error} = await sb.from('subscribers').insert([{
      first_name: fname,
      last_name: lname,
      email: email || null,
      address: addr || null
    }]).select();
    
    if(error) throw error;
    subscribers.push(data[0]);
    closeModal('modalAdd');
    $('fname').value = '';
    $('lname').value = '';
    $('email').value = '';
    $('addr').value = '';
    updateCounts();
    renderSubscribers();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

function openEdit(id) {
  editingSubId = id;
  const sub = subscribers.find(s => s.id === id);
  $('edit_fname').value = sub.first_name || '';
  $('edit_lname').value = sub.last_name || '';
  $('edit_email').value = sub.email || '';
  $('edit_addr').value = sub.address || '';
  $('modalEdit').classList.add('open');
}

async function updateSubscriber(e) {
  e.preventDefault();
  const fname = $('edit_fname').value.trim();
  const lname = $('edit_lname').value.trim();
  const email = $('edit_email').value.trim();
  const addr = $('edit_addr').value.trim();
  
  try {
    await sb.from('subscribers').update({
      first_name: fname,
      last_name: lname,
      email: email || null,
      address: addr || null
    }).eq('id', editingSubId);
    
    const sub = subscribers.find(s => s.id === editingSubId);
    sub.first_name = fname;
    sub.last_name = lname;
    sub.email = email || null;
    sub.address = addr || null;
    
    closeModal('modalEdit');
    renderSubscribers();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

async function deleteSubscriber(id) {
  if(!confirm('Êtes-vous sûr?')) return;
  try {
    await sb.from('subscribers').delete().eq('id', id);
    subscribers = subscribers.filter(s => s.id !== id);
    closeModal('modalEdit');
    updateCounts();
    renderSubscribers();
  } catch(e) {
    alert('❌ ' + e.message);
  }
}

function updateCounts() {
  $('subCount').textContent = subscribers.length;
}

function goView(v) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  event.target.classList.add('on');
  if(v === 'dash') renderDash();
  else if(v === 'subscribers') renderSubscribers();
  else if(v === 'settings') renderSettings();
}

function renderDash() {
  $('content').innerHTML = `
    <div class="head"><h1>📊 Dashboard</h1><p>Vue d'ensemble</p></div>
    <div class="glass" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
      <div><div style="font-size: 12px; color: var(--ink-3);">Total abonnés</div><div style="font-size: 28px; font-weight: 700; margin-top: 8px;">${subscribers.length}</div></div>
      <div><div style="font-size: 12px; color: var(--ink-3);">Status</div><div style="font-size: 28px; font-weight: 700; margin-top: 8px;">✅ OK</div></div>
    </div>
  `;
}

function renderSubscribers() {
  $('content').innerHTML = `
    <div class="head"><h1>👥 Abonnés</h1><p>${subscribers.length} abonné(s)</p></div>
    <button class="btn btn-primary" onclick="$('modalAdd').classList.add('open')" style="margin-bottom: 24px;">➕ Ajouter</button>
    <div class="glass">
      <table class="tbl">
        <thead><tr><th>Nom</th><th>Email</th><th>Adresse</th><th>Actions</th></tr></thead>
        <tbody>
          ${subscribers.map(s => `
            <tr>
              <td><strong>${s.first_name} ${s.last_name}</strong></td>
              <td style="font-size: 12px; color: var(--ink-3);">${s.email || '—'}</td>
              <td style="font-size: 12px; color: var(--ink-3);">${s.address ? s.address.substring(0, 30) : '—'}</td>
              <td><button class="btn" style="font-size: 12px; padding: 6px 12px;" onclick="openEdit('${s.id}')">✏️ Modifier</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderSettings() {
  $('content').innerHTML = `
    <div class="head"><h1>⚙️ Paramètres</h1><p>Configuration</p></div>
    <div class="glass" style="display: flex; justify-content: space-between; align-items: center;">
      <div><div style="font-size: 13px; font-weight: 700;">👤 Compte</div><div style="font-size: 12px; color: var(--ink-3); margin-top: 4px;">paul@sen-no-sen.com</div></div>
      <button class="btn btn-danger" onclick="sb.auth.signOut(); location.reload();">📴 Déconnexion</button>
    </div>
  `;
}

function closeModal(id) {
  $(id).classList.remove('open');
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    $('modalAdd').classList.remove('open');
    $('modalEdit').classList.remove('open');
  }
});
</script>

</body>
</html>
