<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050B18">
<title>Judo Kids — Gestion des Envois</title>
<style>
:root{
  --navy-900:#040A15;
  --navy-700:#0B1B33;
  --accent:#7C5CFF;
  --accent-soft:#AF52DE;
  --accent-deep:#5D3FA6;
  --bg-1:#1e1547;--bg-2:#141030;--bg-3:#0a0612;
  --success:#32D74B;
  --warning:#FFD426;
  --danger:#FF453A;
  --ink:#F2F6FF;
  --ink-2:rgba(242,246,255,.66);
  --ink-3:rgba(242,246,255,.42);
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.085);
  --glass-hi:rgba(255,255,255,.14);
  --stroke:rgba(255,255,255,.10);
  --stroke-2:rgba(255,255,255,.18);
  --g-hi:rgba(255,255,255,.11);
  --g-mid:rgba(255,255,255,.045);
  --g-lo:rgba(255,255,255,.018);
  --g-edge:rgba(255,255,255,.15);
  --r-sm:14px;--r-md:20px;--r-lg:26px;
  --shadow-md:0 12px 34px rgba(0,0,0,.38);
  --blur:42px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:system-ui,sans-serif;background:var(--navy-900);color:var(--ink);overflow:hidden}
body{-webkit-font-smoothing:antialiased}

#root{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px;height:100%;overflow:hidden}

aside{display:flex;flex-direction:column;gap:20px;overflow:auto}
.logo{display:flex;align-items:center;gap:12px;padding:16px;background:var(--glass);border-radius:var(--r-md)}
.logo .ico{width:40px;height:40px;border-radius:var(--r-sm);background:linear-gradient(145deg,var(--accent),var(--accent-deep));display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.logo h1{font-size:16px;font-weight:700}

.nav-sec{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink-3);padding:12px 0 4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);border:1px solid transparent;cursor:pointer;width:100%;text-align:left}
.nav-btn:hover{background:var(--glass-2)}
.nav-btn.on{background:var(--glass-hi);border-color:var(--stroke-2);color:var(--ink)}
.nav-cnt{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-weight:700}

main{display:flex;flex-direction:column;gap:18px;overflow:auto}
.head h1{font-size:26px;font-weight:700}
.head p{font-size:13px;color:var(--ink-3)}

.glass{background:linear-gradient(158deg,var(--g-hi) 0%,var(--g-lo) 42%,var(--g-mid) 100%);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--g-edge);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:20px}

.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .lab{font-size:12px;color:var(--ink-3)}
.kpi .val{font-size:32px;font-weight:700}
.kpi .sub{font-size:11px;color:var(--ink-3)}

.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.tbl th{text-align:left;font-size:11px;font-weight:620;color:var(--ink-2);padding:10px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--stroke)}
.tbl td{padding:11px 10px;border-top:1px solid var(--stroke)}
.tbl tbody tr:hover{background:var(--glass-2)}
.tbl .nm{font-weight:580}

.btn{padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--stroke);background:var(--glass-2);color:var(--ink);cursor:pointer;font-weight:580}
.btn:hover{background:var(--glass-hi)}
.btn.pri{background:linear-gradient(145deg,var(--accent),var(--accent-soft));border:none;color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}

.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(50,215,75,.15);color:var(--success);border:1px solid rgba(50,215,75,.25)}
.pill.o{background:rgba(255,212,38,.15);color:var(--warning);border-color:rgba(255,212,38,.25)}

.search-box{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-md);margin-bottom:16px}
.search-box input{flex:1;background:transparent;border:none;color:var(--ink);font-size:14px;outline:none}
.search-box input::placeholder{color:var(--ink-3)}

.action-btn{padding:6px 10px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink-2);cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.action-btn:hover{background:var(--glass-hi);color:var(--ink)}
.action-btn.danger{color:var(--danger)}
.action-btn.danger:hover{background:rgba(255,69,58,.15)}

input[type="color"]{
  cursor:pointer;
}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--navy-700);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:28px;width:90%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-box h2{font-size:18px;margin-bottom:16px}
.form-group{margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12px;font-weight:600;color:var(--ink-3)}
.form-group input, .form-group select{padding:10px 12px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--ink);font-size:14px}
.form-group input:focus, .form-group select:focus{outline:none;border-color:var(--accent);background:var(--glass-hi)}
.form-actions{display:flex;gap:12px;margin-top:24px}
.form-actions button{flex:1;padding:12px;border-radius:var(--r-sm);border:1px solid var(--stroke);background:var(--glass-2);color:var(--ink);cursor:pointer;font-weight:580}
.form-actions button.pri{background:linear-gradient(145deg,var(--accent),var(--accent-soft));border:none;color:#fff}

#authScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--navy-900);display:flex;align-items:center;justify-content:center;z-index:10000}
.auth-box{width:90%;max-width:400px}
.auth-box h2{font-size:24px;margin-bottom:20px}
.auth-box .form-group{margin-bottom:16px}
.auth-box .btn{width:100%;margin-top:8px}
</style>

<body>
<div id="authScreen">
  <div class="auth-box">
    <h2 style="text-align:center;margin-bottom:24px">🥋 Judo Kids</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="paul@sen-no-sen.com">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="authPassword" placeholder="Votre mot de passe">
    </div>
    <button class="btn pri" onclick="loginSupabase()" style="width:100%;margin-top:16px">Connexion</button>
    <div id="authMsg" style="margin-top:12px;font-size:13px;color:var(--warning);text-align:center"></div>
  </div>
</div>

<div id="root" style="display:none">
  <aside>
    <div class="logo">
      <div class="ico">🥋</div>
      <div><h1>Judo Kids</h1><div style="font-size:11px;color:var(--ink-3);margin-top:4px;cursor:pointer" onclick="logoutSupabase()">Déconnexion</div></div>
    </div>
    
    <div>
      <div class="nav-sec">Navigation</div>
      <button class="nav-btn on" onclick="goView('dashboard')">📊 Dashboard</button>
      <button class="nav-btn" onclick="goView('abonnes')">👥 Abonnés <span class="nav-cnt" id="cntAbo">—</span></button>
      <button class="nav-btn" onclick="goView('envois')">📦 Envois <span class="nav-cnt" id="cntEnv">—</span></button>
      <button class="nav-btn" onclick="goView('settings')">⚙️ Paramètres</button>
    </div>
  </aside>

  <main id="content"></main>
</div>

<!-- MODAL: Ajouter abonné -->
<div id="addModal" class="modal">
  <div class="modal-box">
    <h2>Ajouter un abonné</h2>
    <form onsubmit="saveSubscriber(event)">
      <div class="form-group">
        <label>Prénom*</label>
        <input type="text" id="fname" required>
      </div>
      <div class="form-group">
        <label>Nom*</label>
        <input type="text" id="lname" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email">
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" id="phone">
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" id="addr">
      </div>
      <div class="form-group">
        <label>Date d'abonnement*</label>
        <input type="date" id="sub_date" required>
      </div>
      <div class="form-group">
        <label>Durée d'abonnement*</label>
        <select id="sub_duration" required>
          <option value="">-- Sélectionner --</option>
          <option value="1">1 an (6 envois)</option>
          <option value="2">2 ans (12 envois)</option>
          <option value="3">3 ans (18 envois)</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" onclick="closeModal('addModal')">Annuler</button>
        <button type="submit" class="pri">Créer</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: Éditer abonné -->
<div id="editModal" class="modal">
  <div class="modal-box">
    <h2>Modifier abonné</h2>
    <form onsubmit="updateSubscriber(event)">
      <div class="form-group">
        <label>Prénom*</label>
        <input type="text" id="edit_fname" required>
      </div>
      <div class="form-group">
        <label>Nom*</label>
        <input type="text" id="edit_lname" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="edit_email">
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" id="edit_phone">
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" id="edit_addr">
      </div>
      <div class="form-group">
        <label>Date d'abonnement*</label>
        <input type="date" id="edit_sub_date" required>
      </div>
      <div class="form-group">
        <label>Durée d'abonnement*</label>
        <select id="edit_sub_duration" required>
          <option value="">-- Sélectionner --</option>
          <option value="1">1 an (6 envois)</option>
          <option value="2">2 ans (12 envois)</option>
          <option value="3">3 ans (18 envois)</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" onclick="closeModal('editModal')">Annuler</button>
        <button type="submit" class="pri">Sauvegarder</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: Renouveler -->
<div id="renewModal" class="modal">
  <div class="modal-box">
    <h2>Renouveler l'abonnement</h2>
    <form onsubmit="confirmRenewal(event)">
      <div class="form-group">
        <label>Nouvelle date de départ*</label>
        <input type="date" id="renew_sub_date" required>
      </div>
      <div class="form-group">
        <label>Durée du nouvel abonnement*</label>
        <select id="renew_sub_duration" required>
          <option value="">-- Sélectionner --</option>
          <option value="1">1 an (6 envois)</option>
          <option value="2">2 ans (12 envois)</option>
          <option value="3">3 ans (18 envois)</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" onclick="closeModal('renewModal')">Annuler</button>
        <button type="submit" class="pri">Créer le renouvellement</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
// ==================== INIT VARS ====================
let supabaseClient = null;
let currentUserId = null;
let subscribers = [];
let shipments = [];
let editingSubId = null;
let renewingSubId = null;

// ==================== HELPERS ====================
const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

function openModal(id){
  $(id).classList.add('open');
}

function closeModal(id){
  $(id).classList.remove('open');
}

const SCHEDULE = [
  {shipment:1, mag:4, release:'2026-09-01', deadline:'2026-10-15'},
  {shipment:2, mag:5, release:'2026-11-01', deadline:'2026-12-15'},
  {shipment:3, mag:6, release:'2027-01-01', deadline:'2027-02-15'},
  {shipment:4, mag:7, release:'2027-03-01', deadline:'2027-04-15'},
  {shipment:5, mag:8, release:'2027-05-01', deadline:'2027-06-15'},
  {shipment:6, mag:9, release:'2027-07-01', deadline:'2027-08-15'},
  {shipment:7, mag:10, release:'2027-09-01', deadline:'2027-10-15'},
  {shipment:8, mag:11, release:'2027-11-01', deadline:'2027-12-15'},
  {shipment:9, mag:12, release:'2028-01-01', deadline:'2028-02-15'},
  {shipment:10, mag:13, release:'2028-03-01', deadline:'2028-04-15'},
  {shipment:11, mag:14, release:'2028-05-01', deadline:'2028-06-15'},
  {shipment:12, mag:15, release:'2028-07-01', deadline:'2028-08-15'},
  {shipment:13, mag:16, release:'2028-09-01', deadline:'2028-10-15'},
  {shipment:14, mag:17, release:'2028-11-01', deadline:'2028-12-15'},
  {shipment:15, mag:18, release:'2029-01-01', deadline:'2029-02-15'},
  {shipment:16, mag:19, release:'2029-03-01', deadline:'2029-04-15'},
  {shipment:17, mag:20, release:'2029-05-01', deadline:'2029-06-15'},
  {shipment:18, mag:21, release:'2029-07-01', deadline:'2029-08-15'},
];

function getMagazineForSubscription(subDate){
  const subDateObj = new Date(subDate);
  for(let i = 0; i < SCHEDULE.length; i++){
    const deadlineDate = new Date(SCHEDULE[i].deadline);
    if(subDateObj <= deadlineDate){
      return SCHEDULE[i].mag;
    }
  }
  return SCHEDULE[SCHEDULE.length - 1].mag + 1;
}

// ==================== AUTH ====================
async function loginSupabase(){
  const email = $('authEmail').value;
  const password = $('authPassword').value;
  
  if(!email || !password){
    $('authMsg').textContent = 'Veuillez remplir tous les champs';
    return;
  }
  
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });
  
  if(error){
    $('authMsg').textContent = 'Erreur: ' + error.message;
    return;
  }
  
  currentUserId = data.session.user.id;
  $('authScreen').style.display = 'none';
  $('root').style.display = 'grid';
  
  // Charger les données
  await loadData();
  renderDash();
}

function logoutSupabase(){
  supabaseClient.auth.signOut();
  currentUserId = null;
  $('authScreen').style.display = 'flex';
  $('root').style.display = 'none';
  $('authEmail').value = '';
  $('authPassword').value = '';
}

// ==================== DATA LOADING ====================
async function loadData(){
  // Charger les abonnés
  const { data: subs, error: subError } = await supabaseClient
    .from('subscribers')
    .select('*')
    .eq('user_id', currentUserId);
  
  if(!subError && subs){
    subscribers = subs;
  }
  
  // Charger les envois
  const { data: ships, error: shipError } = await supabaseClient
    .from('shipments')
    .select('*')
    .eq('user_id', currentUserId);
  
  if(!shipError && ships){
    shipments = ships;
  }
  
  updateCounts();
}

async function updateCounts(){
  const today = new Date();
  let currentMag = SCHEDULE[SCHEDULE.length - 1].mag;
  
  for(let sched of SCHEDULE){
    if(new Date(sched.release) <= today){
      currentMag = sched.mag;
    } else {
      break;
    }
  }
  
  const pendingCurrentMag = shipments.filter(s =>
    s.magazine_number === currentMag && !s.sent_at
  ).length;
  
  $('cntAbo').textContent = subscribers.length;
  $('cntEnv').textContent = pendingCurrentMag;
}

// ==================== SAVE SUBSCRIBER ====================
async function saveSubscriber(e){
  e.preventDefault();
  
  const fname = $('fname').value;
  const lname = $('lname').value;
  const email = $('email').value || null;
  const phone = $('phone').value || null;
  const addr = $('addr').value || '';
  const subDate = $('sub_date').value;
  const subDuration = parseInt($('sub_duration').value);
  
  const firstMag = getMagazineForSubscription(subDate);
  
  // Insérer l'abonné
  const { data: sub, error: subError } = await supabaseClient
    .from('subscribers')
    .insert({
      user_id: currentUserId,
      first_name: fname,
      last_name: lname,
      email,
      phone,
      address: addr,
      subscription_date: subDate,
      subscription_duration: subDuration
    })
    .select()
    .single();
  
  if(subError){
    alert('Erreur: ' + subError.message);
    return;
  }
  
  // Créer les envois
  const endDate = new Date(subDate);
  endDate.setFullYear(endDate.getFullYear() + subDuration);
  
  let shipmentNum = 1;
  let posterNum = 1;
  let stickerStart = 1;
  let magazineNum = firstMag;
  
  // Trouver le premier envoi
  let firstScheduleIdx = -1;
  for(let i = 0; i < SCHEDULE.length; i++){
    if(SCHEDULE[i].mag === firstMag){
      firstScheduleIdx = i;
      break;
    }
  }
  
  if(firstScheduleIdx >= 0){
    const shipsToInsert = [];
    
    for(let i = firstScheduleIdx; i < SCHEDULE.length && shipmentNum <= subDuration * 6; i++){
      const schedDate = new Date(SCHEDULE[i].release);
      if(schedDate <= endDate){
        shipsToInsert.push({
          user_id: currentUserId,
          subscriber_id: sub.id,
          shipment_number: shipmentNum,
          magazine_number: magazineNum,
          poster_number: posterNum,
          sticker_pair_start: stickerStart,
          sticker_pair_end: stickerStart + 1,
          scheduled_date: SCHEDULE[i].release,
          sent_at: null
        });
        
        shipmentNum++;
        posterNum++;
        stickerStart += 2;
        magazineNum++;
      }
    }
    
    if(shipsToInsert.length > 0){
      const { error: shipError } = await supabaseClient
        .from('shipments')
        .insert(shipsToInsert);
      
      if(shipError){
        alert('Erreur envois: ' + shipError.message);
        return;
      }
    }
  }
  
  closeModal('addModal');
  await loadData();
  renderAbonnes();
}

// ==================== UPDATE SUBSCRIBER ====================
function editSubscriber(id){
  console.log('Édition de l\'abonné:', id);
  editingSubId = id;
  const sub = subscribers.find(s => s.id === id);
  
  if(!sub){
    alert('Abonné non trouvé!');
    return;
  }
  
  $('edit_fname').value = sub.first_name || '';
  $('edit_lname').value = sub.last_name || '';
  $('edit_email').value = sub.email || '';
  $('edit_phone').value = sub.phone || '';
  $('edit_addr').value = sub.address || '';
  $('edit_sub_date').value = sub.subscription_date || '';
  $('edit_sub_duration').value = sub.subscription_duration || '1';
  
  console.log('Modal ouverte avec:', sub);
  openModal('editModal');
}

async function updateSubscriber(e){
  e.preventDefault();
  
  if(!editingSubId){
    alert('Erreur: ID abonné manquant');
    return;
  }
  
  const fname = $('edit_fname').value.trim();
  const lname = $('edit_lname').value.trim();
  const email = $('edit_email').value.trim() || null;
  const phone = $('edit_phone').value.trim() || null;
  const addr = $('edit_addr').value.trim() || '';
  const subDate = $('edit_sub_date').value;
  const subDuration = parseInt($('edit_sub_duration').value);
  
  if(!fname || !lname || !subDate){
    alert('Veuillez remplir: Prénom, Nom et Date d\'abonnement');
    return;
  }
  
  console.log('Mise à jour:', { editingSubId, fname, lname, email, phone, addr, subDate, subDuration });
  
  const { error } = await supabaseClient
    .from('subscribers')
    .update({
      first_name: fname,
      last_name: lname,
      email,
      phone,
      address: addr,
      subscription_date: subDate,
      subscription_duration: subDuration,
      updated_at: new Date().toISOString()
    })
    .eq('id', editingSubId);
  
  if(error){
    console.error('Erreur mise à jour:', error);
    alert('Erreur: ' + error.message);
    return;
  }
  
  console.log('✅ Mise à jour réussie!');
  closeModal('editModal');
  await loadData();
  renderAbonnes();
}

// ==================== DELETE SUBSCRIBER ====================
async function deleteSubscriber(id){
  if(!confirm('Supprimer cet abonné et tous ses envois?')) return;
  
  console.log('Suppression de l\'abonné:', id);
  
  // Supprimer les envois
  const { error: shipError } = await supabaseClient
    .from('shipments')
    .delete()
    .eq('subscriber_id', id);
  
  if(shipError){
    console.error('Erreur suppression envois:', shipError);
    alert('Erreur: ' + shipError.message);
    return;
  }
  
  // Supprimer l'abonné
  const { error: subError } = await supabaseClient
    .from('subscribers')
    .delete()
    .eq('id', id);
  
  if(subError){
    console.error('Erreur suppression abonné:', subError);
    alert('Erreur: ' + subError.message);
    return;
  }
  
  console.log('✅ Suppression réussie!');
  await loadData();
  renderAbonnes();
}

// ==================== RENEWAL ====================
function renewSubscription(id){
  renewingSubId = id;
  const sub = subscribers.find(s => s.id === id);
  
  const prevSubDate = new Date(sub.subscription_date);
  const renewalDate = new Date(prevSubDate);
  renewalDate.setFullYear(renewalDate.getFullYear() + sub.subscription_duration);
  
  $('renew_sub_date').value = renewalDate.toISOString().split('T')[0];
  $('renew_sub_duration').value = '1';
  
  openModal('renewModal');
}

async function confirmRenewal(e){
  e.preventDefault();
  
  const renewalDate = $('renew_sub_date').value;
  const renewalDuration = parseInt($('renew_sub_duration').value);
  
  const lastShipment = shipments
    .filter(s => s.subscriber_id === renewingSubId)
    .sort((a, b) => b.shipment_number - a.shipment_number)[0];
  
  const lastMagNum = lastShipment ? lastShipment.magazine_number : 9;
  const lastPosterNum = lastShipment ? lastShipment.poster_number : 6;
  const lastStickerEnd = lastShipment ? lastShipment.sticker_pair_end : 12;
  
  const firstNewMag = lastMagNum + 1;
  let firstNewScheduleIdx = -1;
  
  for(let i = 0; i < SCHEDULE.length; i++){
    if(SCHEDULE[i].mag === firstNewMag){
      firstNewScheduleIdx = i;
      break;
    }
  }
  
  if(firstNewScheduleIdx >= 0){
    const endDate = new Date(renewalDate);
    endDate.setFullYear(endDate.getFullYear() + renewalDuration);
    
    let shipmentNum = 1;
    let posterNum = lastPosterNum + 1;
    let stickerStart = lastStickerEnd + 1;
    let magazineNum = firstNewMag;
    
    const shipsToInsert = [];
    
    for(let i = firstNewScheduleIdx; i < SCHEDULE.length && shipmentNum <= renewalDuration * 6; i++){
      const schedDate = new Date(SCHEDULE[i].release);
      if(schedDate <= endDate){
        shipsToInsert.push({
          user_id: currentUserId,
          subscriber_id: renewingSubId,
          shipment_number: (lastShipment ? lastShipment.shipment_number : 0) + shipmentNum,
          magazine_number: magazineNum,
          poster_number: posterNum,
          sticker_pair_start: stickerStart,
          sticker_pair_end: stickerStart + 1,
          scheduled_date: SCHEDULE[i].release,
          sent_at: null
        });
        
        shipmentNum++;
        posterNum++;
        stickerStart += 2;
        magazineNum++;
      }
    }
    
    if(shipsToInsert.length > 0){
      await supabaseClient
        .from('shipments')
        .insert(shipsToInsert);
    }
  }
  
  closeModal('renewModal');
  await loadData();
  viewSubscriberProfile(renewingSubId);
}

function goView(v){
  $$('.nav-btn').forEach(b => b.classList.remove('on'));
  event.target.closest('.nav-btn').classList.add('on');
  
  if(v === 'dashboard') renderDash();
  else if(v === 'abonnes') renderAbonnes();
  else if(v === 'envois') renderEnvois();
  else if(v === 'settings') renderSettings();
}

function renderDash(){
  const today = new Date();
  let currentMag = SCHEDULE[SCHEDULE.length - 1].mag;
  
  for(let sched of SCHEDULE){
    if(new Date(sched.release) <= today){
      currentMag = sched.mag;
    } else {
      break;
    }
  }
  
  const pending = shipments.filter(s => !s.sent_at).length;
  const sent = shipments.filter(s => s.sent_at).length;
  const currentPending = shipments.filter(s => s.magazine_number === currentMag && !s.sent_at).length;
  const currentSent = shipments.filter(s => s.magazine_number === currentMag && s.sent_at).length;
  
  $('content').innerHTML = `
    <div class="head"><h1>📊 Dashboard</h1><p>Vue d'ensemble de vos envois</p></div>
    <div class="grid g-4">
      <div class="glass kpi">
        <div class="lab">👥 Abonnés</div>
        <div class="val">${subscribers.length}</div>
        <div class="sub">Actuellement actifs</div>
      </div>
      <div class="glass kpi">
        <div class="lab">📦 En attente</div>
        <div class="val">${currentPending}</div>
        <div class="sub">Mag #${currentMag} à envoyer</div>
      </div>
      <div class="glass kpi">
        <div class="lab">✅ Envoyés</div>
        <div class="val">${currentSent}</div>
        <div class="sub">Mag #${currentMag}</div>
      </div>
      <div class="glass kpi">
        <div class="lab">🎯 Total</div>
        <div class="val">${pending}</div>
        <div class="sub">Tous les magazines</div>
      </div>
    </div>
    
    <div class="glass">
      <div style="font-weight:700;margin-bottom:12px">📚 Magazine #${currentMag}</div>
      <div style="height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden">
        <div style="width:${currentSent + currentPending > 0 ? Math.round((currentSent/(currentSent+currentPending))*100) : 0}%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));transition:width .4s"></div>
      </div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:8px"><b>${currentSent}/${currentSent+currentPending}</b> abonnés livrés</div>
    </div>`;
}

async function markSentFromProfile(shipId){
  if(!confirm('Marquer cet envoi comme envoyé?')) return;
  
  const { error } = await supabaseClient
    .from('shipments')
    .update({ sent_at: new Date().toISOString() })
    .eq('id', shipId);
  
  if(!error){
    const ship = shipments.find(s => s.id === shipId);
    viewSubscriberProfile(ship.subscriber_id);
    await loadData();
  }
}

async function unmarkSentFromProfile(shipId){
  if(!confirm('Annuler le statut "envoyé" pour cet envoi?')) return;
  
  const { error } = await supabaseClient
    .from('shipments')
    .update({ sent_at: null })
    .eq('id', shipId);
  
  if(!error){
    const ship = shipments.find(s => s.id === shipId);
    viewSubscriberProfile(ship.subscriber_id);
    await loadData();
  }
}

let shipmentsFilter = 'all'; // 'all', '2026', '2027', etc.

function renderEnvois(){
  const byMonth = {};
  shipments.forEach(s => {
    const key = s.scheduled_date.slice(0, 7);
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(s);
  });
  
  // Extraire les années uniques
  const years = [...new Set(Object.keys(byMonth).map(m => m.slice(0, 4)))].sort();
  
  // Filtrer les mois selon l'année sélectionnée
  let filteredMonths = Object.keys(byMonth).sort();
  if(shipmentsFilter !== 'all'){
    filteredMonths = filteredMonths.filter(m => m.startsWith(shipmentsFilter));
  }
  
  let html = `
    <div class="head">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div><h1>📦 Envois</h1><p>Historique par mois</p></div>
      </div>
    </div>
    
    <div class="glass" style="margin-bottom:16px">
      <div style="font-weight:700;margin-bottom:12px">🗓️ Filtrer par année</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ${shipmentsFilter === 'all' ? 'pri' : ''}" onclick="shipmentsFilter='all'; renderEnvois()">📅 Tous les envois</button>
        ${years.map(year => `<button class="btn ${shipmentsFilter === year ? 'pri' : ''}" onclick="shipmentsFilter='${year}'; renderEnvois()">${year}</button>`).join('')}
      </div>
    </div>
  `;
  
  if(filteredMonths.length === 0){
    html += `<div class="glass"><div style="color:var(--ink-3);font-size:13px">Aucun envoi pour cette période</div></div>`;
  } else {
    filteredMonths.forEach(month => {
      const m = new Date(month + '-01').toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});
      html += `<div class="glass" style="margin-bottom:16px">
        <div style="font-weight:700;margin-bottom:12px">${m}</div>
        <table class="tbl">
          <thead><tr><th>Abonné</th><th>Mag</th><th>Poster</th><th>Stickers</th><th>Statut</th><th style="text-align:right">Action</th></tr></thead>
          <tbody>${byMonth[month].map(ship => {
            const sub = subscribers.find(x => x.id === ship.subscriber_id);
            return `<tr>
              <td class="nm" onclick="viewSubscriberProfile('${sub.id}')" style="cursor:pointer;text-decoration:underline">${sub.first_name} ${sub.last_name}</td>
              <td>#${ship.magazine_number}</td>
              <td>#${ship.poster_number}</td>
              <td>${ship.sticker_pair_start}-${ship.sticker_pair_end}</td>
              <td><span class="pill ${ship.sent_at?'':'o'}">${ship.sent_at?'✅ Envoyé':'⏳ Attente'}</span></td>
              <td style="text-align:right">${ship.sent_at?`<button class="btn sm" onclick="unmarkSent('${ship.id}')" style="color:var(--warning)">✕</button>`:`<button class="btn sm" onclick="markSent('${ship.id}')">✓</button>`}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`;
    });
  }
  
  $('content').innerHTML = html;
}

async function markSent(id){
  await supabaseClient
    .from('shipments')
    .update({ sent_at: new Date().toISOString() })
    .eq('id', id);
  
  await loadData();
  renderEnvois();
}

  await supabaseClient

    .update({ sent_at: null })
    .eq('id', id);
  
  await loadData();
  renderEnvois();
}
